# .github/workflows/download-ophub-scripts.yml
name: 下载并移植 Ophub 编译脚本

on:
  workflow_dispatch:
    inputs:
      download_method:
        description: '下载方式'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'          # 下载所有脚本
          - 'kernel-only'  # 仅下载内核相关脚本
          - 'check'        # 只检查不下载

permissions:
  contents: write

jobs:
  download-scripts:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 下载 Ophub 仓库
        run: |
          echo "🔍 下载 Ophub/amlogic-s9xxx-armbian 仓库..."
          
          # 创建临时目录
          TEMP_DIR=$(mktemp -d)
          cd $TEMP_DIR
          
          # 克隆 Ophub 仓库（只获取最新版本）
          git clone --depth=1 https://github.com/ophub/amlogic-s9xxx-armbian.git ophub-repo
          
          echo "✅ 下载完成"
          echo "📁 仓库结构："
          find ophub-repo -type f -name "*.sh" -o -name "*.yml" | sort
          
          # 保存仓库路径到环境变量
          echo "OPHUB_REPO=$TEMP_DIR/ophub-repo" >> $GITHUB_ENV

      - name: 分析脚本依赖关系
        run: |
          echo "🔍 分析 Ophub 编译流程的脚本依赖..."
          
          # 检查 action.yml 中定义的入口
          echo "📄 Action 入口定义："
          if [ -f "${{ env.OPHUB_REPO }}/action.yml" ]; then
            grep -A5 -B5 "runs:" "${{ env.OPHUB_REPO }}/action.yml" || true
          fi
          
          # 检查主要工作流文件
          echo "📄 主要工作流文件："
          find "${{ env.OPHUB_REPO }}" -name "*.yml" -type f | head -10

      - name: 识别必要脚本（内核编译相关）
        run: |
          echo "🎯 识别内核编译相关脚本..."
          
          # 创建脚本列表文件
          SCRIPT_LIST=$(mktemp)
          
          # 查找所有脚本文件
          find "${{ env.OPHUB_REPO }}" -type f -name "*.sh" | while read script; do
            # 检查文件内容是否包含关键词
            if grep -q -i "kernel\|compile\|patch\|download" "$script"; then
              echo "$script" >> $SCRIPT_LIST
              echo "📝 发现脚本: $(basename $script) → $(dirname $script | sed "s|${{ env.OPHUB_REPO }}||")"
            fi
          done
          
          echo "📊 发现脚本数量: $(wc -l < $SCRIPT_LIST)"
          echo "SCRIPT_LIST=$SCRIPT_LIST" >> $GITHUB_ENV

      - name: 复制内核编译脚本（方式：${{ inputs.download_method }}）
        run: |
          OPHUB_REPO="${{ env.OPHUB_REPO }}"
          METHOD="${{ github.event.inputs.download_method }}"
          
          echo "🚀 开始复制脚本，方式: $METHOD"
          
          # 确保目标目录存在
          mkdir -p files/kernel scripts
          
          if [[ "$METHOD" == "all" || "$METHOD" == "kernel-only" ]]; then
            # 复制核心脚本
            echo "📁 复制核心脚本文件..."
            
            # 1. 复制 files/kernel/ 目录下的所有脚本
            if [ -d "$OPHUB_REPO/files/kernel" ]; then
              echo "📂 复制 files/kernel/ 目录"
              cp -r "$OPHUB_REPO/files/kernel/"* ./files/kernel/ 2>/dev/null || true
              echo "  已复制: $(ls ./files/kernel/ | wc -l) 个文件"
              ls -la ./files/kernel/
            else
              echo "⚠️ files/kernel/ 目录不存在"
            fi
            
            # 2. 复制 scripts/ 目录下的所有脚本
            if [ -d "$OPHUB_REPO/scripts" ]; then
              echo "📂 复制 scripts/ 目录"
              cp -r "$OPHUB_REPO/scripts/"* ./scripts/ 2>/dev/null || true
              echo "  已复制: $(ls ./scripts/ | wc -l) 个文件"
              ls -la ./scripts/
            else
              echo "⚠️ scripts/ 目录不存在"
            fi
            
            # 3. 复制 action.yml
            if [ -f "$OPHUB_REPO/action.yml" ]; then
              echo "📄 复制 action.yml"
              cp "$OPHUB_REPO/action.yml" ./
            fi
            
            # 4. 复制 README.md（了解使用方式）
            if [ -f "$OPHUB_REPO/README.md" ]; then
              echo "📄 复制 README.md"
              cp "$OPHUB_REPO/README.md" ./OPHUB_README.md
            fi
          fi
          
          if [[ "$METHOD" == "all" ]]; then
            # 复制其他可能需要的文件
            echo "📁 复制其他相关文件..."
            
            # 复制 workflows 目录（了解工作流结构）
            if [ -d "$OPHUB_REPO/.github/workflows" ]; then
              mkdir -p .github/workflows
              echo "📂 复制 .github/workflows/ 目录"
              cp -r "$OPHUB_REPO/.github/workflows/"* .github/workflows/ 2>/dev/null || true
            fi
            
            # 复制其他配置文件
            find "$OPHUB_REPO" -name "*.conf" -o -name "*.config" | while read config; do
              rel_path=$(echo $config | sed "s|$OPHUB_REPO/||")
              mkdir -p "$(dirname "$rel_path")"
              cp "$config" "./$rel_path" 2>/dev/null || true
            done
          fi
          
          echo "✅ 复制完成"

      - name: 验证脚本完整性
        run: |
          echo "🔍 验证复制的脚本文件..."
          
          # 检查关键文件是否存在
          REQUIRED_FILES=(
            "files/kernel/kernel-compile.sh"
            "files/kernel/kernel-patch.sh"
            "files/kernel/kernel-download.sh"
            "scripts/kernel.sh"
          )
          
          MISSING_FILES=()
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file 存在"
              # 显示文件基本信息
              echo "  大小: $(wc -l < "$file") 行, 权限: $(stat -c "%A" "$file")"
            else
              echo "❌ $file 缺失"
              MISSING_FILES+=("$file")
            fi
          done
          
          # 检查文件是否可执行
          echo "🔧 设置执行权限..."
          chmod +x files/kernel/*.sh scripts/*.sh 2>/dev/null || true
          
          # 显示最终目录结构
          echo "📁 最终目录结构："
          find . -type f \( -name "*.sh" -o -name "*.yml" \) | grep -v ".git" | sort

      - name: 分析脚本调用关系
        run: |
          echo "🔗 分析脚本调用关系..."
          
          # 分析 kernel.sh 调用了哪些脚本
          if [ -f "scripts/kernel.sh" ]; then
            echo "📄 scripts/kernel.sh 调用分析："
            grep -E "source |\. |sh " scripts/kernel.sh | head -20
          fi
          
          # 分析 kernel-patch.sh 的内容（关键）
          if [ -f "files/kernel/kernel-patch.sh" ]; then
            echo "📄 files/kernel/kernel-patch.sh 关键函数："
            grep -n "function\|apply.*patch" files/kernel/kernel-patch.sh | head -20
          fi

      - name: 提交移植的脚本到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "📊 检查文件变更..."
          
          # 添加所有新复制的文件
          git add files/ scripts/ action.yml OPHUB_README.md .github/workflows/ 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "ℹ️ 无新文件，无需提交"
          else
            echo "📋 将要提交的文件："
            git diff --cached --name-only
            
            COMMIT_MSG="移植 Ophub 编译脚本 | 方式：${{ github.event.inputs.download_method }} | $(date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "$COMMIT_MSG"
            
            git push origin main
            echo "✅ 脚本已提交到仓库"
          fi

      - name: 清理临时文件
        if: always()
        run: |
          echo "🧹 清理临时文件..."
          if [ -n "${{ env.OPHUB_REPO }}" ]; then
            rm -rf "$(dirname "${{ env.OPHUB_REPO }}")" 2>/dev/null || true
          fi
          echo "✅ 清理完成"
