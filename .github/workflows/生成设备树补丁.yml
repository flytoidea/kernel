name: 转换设备树补丁
on:
  workflow_dispatch:  # 手动触发
#  schedule:
#    - cron: '0 0 * * *'  # 每天自动运行一次

# 权限
permissions:
  contents: write

jobs:
  auto-convert-dts:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 2. 扫描custom-dts目录结构
        run: |
          set -euo pipefail
          echo "📁 开始扫描custom-dts目录..."
          
          # 创建扫描结果文件
          SCAN_FILE="${{ github.workspace }}/dts_scan.txt"
          echo "内核版本 | 子目录 | DTS文件数" > "$SCAN_FILE"
          echo "--------|--------|----------" >> "$SCAN_FILE"
          
          # 查找所有内核版本目录（过滤非linux-*.y），用while read避免子shell
          find "${{ github.workspace }}/custom-dts" -maxdepth 1 -type d -name "linux-*.y" -print0 | while IFS= read -r -d '' kernel_dir; do
            kernel_name=$(basename "$kernel_dir")
            echo "🔍 扫描内核: $kernel_name"
            
            # 遍历子目录，过滤空目录
            find "$kernel_dir" -mindepth 1 -maxdepth 1 -type d -print0 | while IFS= read -r -d '' subdir; do
              subdir_name=$(basename "$subdir")
              # 精准统计dts文件，避免空输出
              dts_count=$(find "$subdir" -type f -name "*.dts" | wc -l)
              
              if [ "$dts_count" -gt 0 ]; then
                echo "$kernel_name | $subdir_name | $dts_count" >> "$SCAN_FILE"
                echo "  📂 子目录 $subdir_name: $dts_count 个DTS文件"
              fi
            done
          done
          
          # 显示扫描结果
          echo ""
          echo "📊 扫描完成:"
          cat "$SCAN_FILE"

      - name: 3. 为每个内核版本和子目录生成补丁
        run: |
          set -euo pipefail
          # 工具函数：查找Makefile中的插入位置
          find_makefile_insertion_point() {
            local makefile="$1"
            local dts_name="$2"
            # 提取设备系列（取短横线前的部分，适配rk3568、rk3568-hlink等格式）
            local device_series=$(echo "$dts_name" | cut -d'-' -f1 | tr -d '[:space:]')
            [ -z "$device_series" ] && device_series="$dts_name"
            
            echo "🔍 设备系列: $device_series"
            # 查找该设备系列的最后一个条目（忽略大小写，适配CONFIG_ARCH_RK3568/CONFIG_ARCH_rockchip）
            local line_num=$(grep -n -i "+=.*$device_series" "$makefile" | tail -1 | cut -d':' -f1)
            
            if [ -n "$line_num" ]; then
              echo "✅ 找到插入位置: 第 $line_num 行"
              echo "$line_num"
            else
              # 如果没找到，在Makefile末尾添加（排除空行）
              local total_lines=$(grep -v '^[[:space:]]*$' "$makefile" | wc -l)
              [ "$total_lines" -eq 0 ] && total_lines=1
              echo "⚠️  未找到设备系列，将在末尾添加 (第 $total_lines 行)"
              echo "$total_lines"
            fi
          }
          
          # 工具函数：生成随机7位哈希（兼容所有Linux环境）
          gen_rand_hash() {
            head -c 16 /dev/urandom | sha256sum | cut -c1-7
          }
          
          # 工具函数：生成补丁文件
          generate_patch() {
            local kernel_dir="$1"
            local subdir="$2"
            local dts_file="$3"
            local patch_number="$4"
            local patch_count="$5"
            
            local kernel_name=$(basename "$kernel_dir")
            local subdir_name=$(basename "$subdir")
            local dts_name=$(basename "$dts_file" .dts)
            local dts_base=$(basename "$dts_file")
            local device_series=$(echo "$dts_name" | cut -d'-' -f1 | tr -d '[:space:]')
            [ -z "$device_series" ] && device_series="$dts_name"

            # 补丁输出目录
            local patch_output_dir="${{ github.workspace }}/kernel-patch/beta/$kernel_name"
            mkdir -p "$patch_output_dir" || { echo "❌ 无法创建目录: $patch_output_dir"; return 1; }
            
            # 生成补丁文件名（避免特殊字符）
            local patch_filename="${patch_number}-dts-add-${subdir_name}-${dts_name//\//-}-dtb.patch"
            local patch_path="$patch_output_dir/$patch_filename"
            
            # 获取Makefile路径
            local makefile_path="$subdir/Makefile"
            [ ! -f "$makefile_path" ] && { echo "❌ 错误: $makefile_path 不存在"; return 1; }
            [ ! -s "$makefile_path" ] && { echo "❌ 错误: $makefile_path 为空文件"; return 1; }
            
            # 计算Makefile插入位置
            local insert_line=$(find_makefile_insertion_point "$makefile_path" "$dts_name")
            [ -z "$insert_line" ] && insert_line=1
            
            # 计算行数（排除空行，避免diff错误）
            local dts_line_count=$(grep -v '^[[:space:]]*$' "$dts_file" | wc -l)
            local makefile_line_count=$(grep -v '^[[:space:]]*$' "$makefile_path" | wc -l)
            [ "$dts_line_count" -eq 0 ] && { echo "❌ 错误: $dts_file 为空文件"; return 1; }

            # 生成CONFIG_ARCH_XXX（全大写，适配内核标准）
            local config_arch=$(echo "$device_series" | tr '[:lower:]' '[:upper:]')
            local makefile_add_line="dtb-\$(CONFIG_ARCH_$config_arch) += $dts_name.dtb"
            
            # 生成完整的git补丁（避免特殊字符解析错误）
            {
              # Git补丁标准头
              echo "From $(git rev-parse --short=40 HEAD 2>/dev/null || gen_rand_hash) Mon Sep 17 00:00:00 2001"
              echo "From: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
              echo "Date: $(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
              echo "Subject: [PATCH] $kernel_name: Add $dts_name dtb"
              echo ""
              echo "Add device tree blob for $dts_name"
              echo ""
              echo "Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
              echo "---"
              echo " arch/arm64/boot/dts/$subdir_name/Makefile        | 1 +"
              echo " arch/arm64/boot/dts/$subdir_name/$dts_base      | $dts_line_count +"
              echo " 2 files changed, $((dts_line_count + 1)) insertions(+)"
              echo " create mode 100644 arch/arm64/boot/dts/$subdir_name/$dts_base"
              echo ""
              # Makefile Diff（标准格式，行号容错）
              echo "diff --git a/arch/arm64/boot/dts/$subdir_name/Makefile b/arch/arm64/boot/dts/$subdir_name/Makefile"
              echo "index $(gen_rand_hash)..$(gen_rand_hash) 100644"
              echo "--- a/arch/arm64/boot/dts/$subdir_name/Makefile"
              echo "+++ b/arch/arm64/boot/dts/$subdir_name/Makefile"
              # 计算diff行号（适配末尾插入，避免超出范围）
              local diff_start=$((insert_line < 5 ? 1 : insert_line - 4))
              local diff_count=$((makefile_line_count - diff_start + 2))
              [ "$diff_count" -lt 1 ] && diff_count=1
              echo "@@ -$diff_start,$diff_count +$diff_start,$((diff_count + 1)) @@"
              # 生成Makefile修改内容（用awk精准处理，避免重复+号）
              awk -v insert="$insert_line" -v add="$makefile_add_line" '
                NR == insert {print $0; print "+"add; next}
                {print " " $0}
              ' "$makefile_path" | tail -n "$((diff_count + 1))"
              # DTS文件Diff（新文件标准格式）
              echo ""
              echo "diff --git a/arch/arm64/boot/dts/$subdir_name/$dts_base b/arch/arm64/boot/dts/$subdir_name/$dts_base"
              echo "new file mode 100644"
              echo "index 0000000..$(gen_rand_hash)"
              echo "--- /dev/null"
              echo "+++ b/arch/arm64/boot/dts/$subdir_name/$dts_base"
              echo "@@ -0,0 +1,$dts_line_count @@"
              # 添加DTS内容（处理特殊字符，保留原格式）
              while IFS= read -r line; do
                echo "+$line"
              done < "$dts_file"
              echo "---"
              echo "Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            } > "$patch_path" || { echo "❌ 生成补丁失败: $patch_filename"; return 1; }
            
            # 验证补丁
            if [ -s "$patch_path" ] && grep -q "Subject: \[PATCH\]" "$patch_path"; then
              echo "✅ 生成补丁 [$patch_number/$patch_count]: $patch_filename"
              return 0
            else
              rm -f "$patch_path"
              echo "❌ 补丁无效已删除: $patch_filename"
              return 1
            fi
          }
          
          # 主处理逻辑（全局编号，避免重复）
          echo "🚀 开始生成设备树补丁..."
          TOTAL_PATCHES=0
          SUCCESS_COUNT=0
          ERROR_COUNT=0
          GLOBAL_PATCH_NUM=301  # 全局补丁编号，所有子目录连续自增
          
          # 遍历所有内核版本目录（-print0避免特殊文件名，无中子shell）
          find "${{ github.workspace }}/custom-dts" -maxdepth 1 -type d -name "linux-*.y" -print0 | while IFS= read -r -d '' kernel_dir; do
            [ ! -d "$kernel_dir" ] && continue
            kernel_name=$(basename "$kernel_dir")
            echo ""
            echo "📦 处理内核: $kernel_name"
            echo "========================================"
            
            # 遍历所有子目录
            find "$kernel_dir" -mindepth 1 -maxdepth 1 -type d -print0 | while IFS= read -r -d '' subdir; do
              [ ! -d "$subdir" ] && continue
              subdir_name=$(basename "$subdir")
              makefile_path="$subdir/Makefile"
              
              # 筛选有效DTS文件（普通文件、非空）
              dts_files=()
              while IFS= read -r -d '' f; do
                dts_files+=("$f")
              done < <(find "$subdir" -type f -name "*.dts" -s -print0)
              dts_count=${#dts_files[@]}
              
              if [ "$dts_count" -eq 0 ]; then
                echo "  ⏭️  跳过 $subdir_name: 无有效DTS文件"
                continue
              fi
              if [ ! -f "$makefile_path" ] || [ ! -s "$makefile_path" ]; then
                echo "  ⏭️  跳过 $subdir_name: 无有效Makefile"
                continue
              fi
              
              echo "  📁 处理 $subdir_name: 找到 $dts_count 个有效DTS文件"
              # 对DTS文件排序，确保顺序一致
              IFS=$'\n' sorted_dts_files=($(sort <<<"${dts_files[*]}"))
              unset IFS
              
              # 为每个DTS文件生成补丁（全局编号连续）
              for dts_file in "${sorted_dts_files[@]}"; do
                echo "    🔧 处理: $(basename "$dts_file")"
                if generate_patch "$kernel_dir" "$subdir" "$dts_file" "$GLOBAL_PATCH_NUM" "$dts_count"; then
                  SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                else
                  ERROR_COUNT=$((ERROR_COUNT + 1))
                fi
                GLOBAL_PATCH_NUM=$((GLOBAL_PATCH_NUM + 1))
                TOTAL_PATCHES=$((TOTAL_PATCHES + 1))
              done
            done
          done
          
          # 输出统计结果（变量可正常传递，无中子shell）
          echo ""
          echo "========================================"
          echo "📊 生成统计:"
          echo "  总共处理: $TOTAL_PATCHES 个文件"
          echo "  成功: $SUCCESS_COUNT"
          echo "  失败: $ERROR_COUNT"
          
          # 失败非0则退出
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "❌ 有 $ERROR_COUNT 个补丁生成失败，终止任务"
            exit 1
          fi
          if [ "$SUCCESS_COUNT" -eq 0 ]; then
            echo "⚠️  未生成任何有效补丁，正常退出"
            exit 0
          fi

      - name: 4. 验证生成的补丁
        run: |
          set -euo pipefail
          echo "🔍 验证生成的补丁..."
          PATCH_ROOT="${{ github.workspace }}/kernel-patch/beta"
          [ ! -d "$PATCH_ROOT" ] && { echo "⚠️  补丁目录不存在，跳过验证"; exit 0; }
          
          # 统计所有有效补丁
          PATCH_FILES=()
          while IFS= read -r -d '' f; do
            PATCH_FILES+=("$f")
          done < <(find "$PATCH_ROOT" -type f -name "*.patch" -s -print0)
          PATCH_COUNT=${#PATCH_FILES[@]}
          
          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "⚠️  未找到有效补丁文件，跳过验证"
            exit 0
          fi
          
          echo "✅ 找到 $PATCH_COUNT 个有效补丁文件"
          echo ""
          echo "📁 补丁目录结构:"
          # 显示目录结构
          find "$PATCH_ROOT" -type d -name "linux-*" -print0 | while IFS= read -r -d '' dir; do
            kernel_ver=$(basename "$dir")
            count=$(find "$dir" -type f -name "*.patch" -s | wc -l)
            echo "  $kernel_ver: $count 个补丁"
            find "$dir" -type f -name "*.patch" -s | sort | while read -r p; do
              echo "    📄 $(basename "$p")"
            done
          done
          
          # 严格验证补丁格式（关键项检查+模拟应用）
          echo ""
          echo "🔬 严格验证补丁格式:"
          VALID_ERROR=0
          for patch_file in "${PATCH_FILES[@]}"; do
            patch_name=$(basename "$patch_file")
            # 检查关键项
            if ! grep -qE "From .* Mon Sep 17 00:00:00 2001|Subject: \[PATCH\]|diff --git|create mode 100644" "$patch_file"; then
              echo "  ❌ $patch_name: 缺少Git补丁标准头"
              VALID_ERROR=$((VALID_ERROR + 1))
              continue
            fi
            if ! grep -q "\.dts" "$patch_file" || ! grep -q "Makefile" "$patch_file"; then
              echo "  ❌ $patch_name: 缺少DTS/Makefile修改内容"
              VALID_ERROR=$((VALID_ERROR + 1))
              continue
            fi
            # 模拟补丁应用（干跑，不实际修改）
            if patch --dry-run -p1 -d /tmp < "$patch_file" 2>/dev/null; then
              echo "  ✅ $patch_name: 格式合法，可正常应用"
            else
              echo "  ❌ $patch_name: 格式错误，无法应用"
              VALID_ERROR=$((VALID_ERROR + 1))
            fi
          done
          
          # 验证失败则退出
          if [ "$VALID_ERROR" -gt 0 ]; then
            echo "❌ 有 $VALID_ERROR 个补丁格式验证失败，终止任务"
            exit 1
          fi
          echo "✅ 所有补丁格式验证通过"

      - name: 5. 提交生成的补丁
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          PATCH_ROOT="${{ github.workspace }}/kernel-patch/beta"
          [ ! -d "$PATCH_ROOT" ] && { echo "ℹ️  补丁目录不存在，无需提交"; exit 0; }
          
          echo "📋 检查文件变更..."
          # 检查是否有新补丁（忽略空格/换行变更）
          if git status --porcelain "$PATCH_ROOT" | grep -q -E "^[AM]"; then
            echo "📦 检测到新/修改的补丁文件"
            # 拉取最新代码，避免推送冲突
            git pull --rebase origin "${GITHUB_REF#refs/heads/}" || git rebase --abort
            # 添加所有补丁文件
            git add "$PATCH_ROOT"
            # 统计提交信息
            KERNEL_VERSIONS=$(find "$PATCH_ROOT" -type d -name "linux-*" -print0 | xargs -0 basename | tr '\n' ', ' | sed 's/, $//')
            PATCH_COUNT=$(find "$PATCH_ROOT" -type f -name "*.patch" -s | wc -l)
            [ -z "$KERNEL_VERSIONS" ] && KERNEL_VERSIONS="未知"
            [ "$PATCH_COUNT" -eq 0 ] && { echo "ℹ️  无有效补丁，无需提交"; exit 0; }
            
            # 提交信息（标准化）
            COMMIT_MSG="chore: 自动生成设备树补丁 [$PATCH_COUNT 个]
      
      涉及内核版本: $KERNEL_VERSIONS
      生成时间: $(date +'%Y-%m-%d %H:%M:%S %Z')
      扫描目录: custom-dts/
      
      自动扫描并生成符合Ophub标准的arm64设备树补丁，包含Makefile配置及DTS文件。
      Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            
            # 提交并推送（适配当前分支，不硬编码）
            git commit -m "$COMMIT_MSG"
            git push origin "${GITHUB_REF#refs/heads/}"
            echo "✅ 补丁已成功提交并推送到当前分支: ${GITHUB_REF#refs/heads/}"
          else
            echo "ℹ️  无新/修改的补丁文件，无需提交"
          fi

      - name: 6. 生成执行报告
        if: always()
        run: |
          set -euo pipefail
          REPORT_FILE="${{ github.workspace }}/dts_patch_report_$(date +%Y%m%d_%H%M%S).txt"
          PATCH_ROOT="${{ github.workspace }}/kernel-patch/beta"
          
          # 生成报告内容
          {
            echo "==================== 设备树补丁自动生成报告 ===================="
            echo "任务ID: $GITHUB_RUN_ID"
            echo "触发方式: ${{ github.event_name == 'workflow_dispatch' ? '手动触发' : '定时自动触发' }}"
            echo "执行时间: $(date +'%Y-%m-%d %H:%M:%S %Z')"
            echo "仓库分支: ${GITHUB_REF#refs/heads/}"
            echo "执行环境: $RUNNER_OS $RUNNER_ARCH"
            echo "=================================================================="
            echo ""
            echo "📁 补丁存储目录: $PATCH_ROOT"
            echo ""
            if [ -d "$PATCH_ROOT" ]; then
              TOTAL_PATCH=$(find "$PATCH_ROOT" -type f -name "*.patch" -s | wc -l)
              KERNEL_COUNT=$(find "$PATCH_ROOT" -type d -name "linux-*" | wc -l)
              echo "📊 全局统计: 共 $KERNEL_COUNT 个内核版本 | 生成 $TOTAL_PATCH 个有效补丁"
              echo ""
              echo "🔍 各内核版本补丁详情:"
              echo "------------------------------------------------------------------"
              find "$PATCH_ROOT" -type d -name "linux-*" -print0 | while IFS= read -r -d '' dir; do
                kernel_ver=$(basename "$dir")
                patch_count=$(find "$dir" -type f -name "*.patch" -s | wc -l)
                echo "• $kernel_ver: $patch_count 个补丁"
                find "$dir" -type f -name "*.patch" -s | sort | while read -r p; do
                  echo "  └─ 📄 $(basename "$p") ($(wc -l < "$p") 行)"
                done
              done
            else
              echo "❌ 补丁目录不存在，未生成任何补丁"
              TOTAL_PATCH=0
            fi
            echo ""
            echo "✅ 任务状态: ${{ job.status == 'success' ? '执行成功' : job.status == 'failed' ? '执行失败' : '已取消' }}"
            echo "=================================================================="
          } > "$REPORT_FILE"
          
          # 显示报告并上传为artifact
          echo "📊 生成执行报告: $(basename "$REPORT_FILE")"
          cat "$REPORT_FILE"
          # 保留报告文件，可通过GitHub Action Artifact下载
          echo "💡 报告文件已保存，可在Action产物中下载"
