# 手动触发 | 生成完整设备树补丁（含Makefile修改）
name: 生成设备树补丁
on:
  workflow_dispatch:
    inputs:
      dts_source_dir:
        description: '选择DTS源目录'
        required: true
        type: choice
        default: 'custom-dts/linux-6.12.y'
        options:
          - custom-dts/linux-5.10.y
          - custom-dts/linux-5.15.y
          - custom-dts/linux-6.1.y
          - custom-dts/linux-6.6.y
          - custom-dts/linux-6.12.y
      kernel_dts_subdir:
        description: '内核DTS子目录（如rockchip、sunxi、amlogic）'
        required: true
        default: 'rockchip'
        type: string
      patch_number:
        description: '补丁编号（默认301）'
        required: true
        default: '301'
        type: string
      patch_description:
        description: '补丁简短描述'
        required: true
        default: 'Add new device'
        type: string
      reference_device:
        description: '参考设备系列（如rk3568）'
        required: true
        default: 'rk3568'
        type: string

permissions:
  contents: write

jobs:
  dts2patch-final:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      DTS_SRC_DIR: ${{ github.event.inputs.dts_source_dir }}
      KERNEL_DTS_SUBDIR: ${{ github.event.inputs.kernel_dts_subdir }}
      PATCH_NUMBER: ${{ github.event.inputs.patch_number }}
      PATCH_DESC: ${{ github.event.inputs.patch_description }}
      REF_DEVICE: ${{ github.event.inputs.reference_device }}
      OPHUB_BETA_ROOT: 'kernel-patch/beta'

    steps:
      - name: 1. 拉取仓库最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 2. 提取目录名并验证
        run: |
          DIR_NAME=$(basename $DTS_SRC_DIR)
          echo "DIR_NAME=$DIR_NAME" >> $GITHUB_ENV
          
          OPHUB_PATCH_DIR="${{ env.OPHUB_BETA_ROOT }}/$DIR_NAME"
          echo "OPHUB_PATCH_DIR=$OPHUB_PATCH_DIR" >> $GITHUB_ENV
          
          echo "📁 目录映射规则："
          echo "  DTS源目录：$DTS_SRC_DIR"
          echo "  → 补丁目录：$OPHUB_PATCH_DIR"
          
          if [ ! -d "$DTS_SRC_DIR" ]; then
            echo "❌ 错误：DTS源目录 $DTS_SRC_DIR 不存在"
            exit 1
          fi
          
          DTS_FILES=($(find "$DTS_SRC_DIR" -name "*.dts"))
          if [ ${#DTS_FILES[@]} -eq 0 ]; then
            echo "❌ 错误：DTS源目录 $DTS_SRC_DIR 下无.dts文件"
            exit 1
          fi
          
          echo "✅ 检测到 ${#DTS_FILES[@]} 个DTS文件"

      - name: 3. 获取内核版本并构造Makefile URL
        run: |
          DIR_NAME="${{ env.DIR_NAME }}"
          KERNEL_DTS_SUBDIR="${{ env.KERNEL_DTS_SUBDIR }}"
          
          # 提取内核版本号（去掉linux-前缀）
          KERNEL_VER=${DIR_NAME#linux-}
          echo "内核版本：$KERNEL_VER"
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
          
          # 根据内核版本和子目录构造Makefile URL
          if [[ "$KERNEL_DTS_SUBDIR" == "rockchip" ]]; then
            if [[ "$KERNEL_VER" == "5.10.y" ]]; then
              MAKEFILE_URL="https://raw.githubusercontent.com/unifreq/linux-5.10.y-rockchip/main/arch/arm64/boot/dts/rockchip/Makefile"
            elif [[ "$KERNEL_VER" == "5.15.y" ]]; then
              MAKEFILE_URL="https://raw.githubusercontent.com/unifreq/linux-5.15.y-rockchip/main/arch/arm64/boot/dts/rockchip/Makefile"
            elif [[ "$KERNEL_VER" == "6.1.y" ]]; then
              MAKEFILE_URL="https://raw.githubusercontent.com/unifreq/linux-6.1.y-rockchip/main/arch/arm64/boot/dts/rockchip/Makefile"
            elif [[ "$KERNEL_VER" == "6.6.y" ]]; then
              MAKEFILE_URL="https://raw.githubusercontent.com/unifreq/linux-6.6.y-rockchip/main/arch/arm64/boot/dts/rockchip/Makefile"
            elif [[ "$KERNEL_VER" == "6.12.y" ]]; then
              MAKEFILE_URL="https://raw.githubusercontent.com/unifreq/linux-6.12.y-rockchip/main/arch/arm64/boot/dts/rockchip/Makefile"
            else
              echo "⚠️ 无法确定精确的Makefile URL，使用通用格式"
              MAKEFILE_URL="https://raw.githubusercontent.com/unifreq/linux-$KERNEL_VER-rockchip/main/arch/arm64/boot/dts/rockchip/Makefile"
            fi
          else
            echo "⚠️ 非rockchip平台，使用通用URL格式"
            MAKEFILE_URL="https://raw.githubusercontent.com/unifreq/linux-$KERNEL_VER-$KERNEL_DTS_SUBDIR/main/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/Makefile"
          fi
          
          echo "📥 Makefile URL: $MAKEFILE_URL"
          echo "MAKEFILE_URL=$MAKEFILE_URL" >> $GITHUB_ENV

      - name: 4. 下载Makefile
        run: |
          MAKEFILE_URL="${{ env.MAKEFILE_URL }}"
          
          echo "📥 下载Makefile..."
          if curl -s -f -o /tmp/original_makefile "$MAKEFILE_URL"; then
            echo "✅ Makefile下载成功"
            # 将Makefile转换为单行base64编码
            base64 /tmp/original_makefile | tr -d '\n' > /tmp/makefile_base64
            echo "MAKEFILE_BASE64=$(cat /tmp/makefile_base64)" >> $GITHUB_ENV
          else
            echo "⚠️ Makefile下载失败，将使用空Makefile"
            echo "MAKEFILE_BASE64=" >> $GITHUB_ENV
          fi

      - name: 5. 生成完整补丁文件
        run: |
          # 创建输出目录
          mkdir -p "${{ env.OPHUB_PATCH_DIR }}"
          
          # 获取变量
          DTS_SRC_DIR="${{ env.DTS_SRC_DIR }}"
          OPHUB_PATCH_DIR="${{ env.OPHUB_PATCH_DIR }}"
          KERNEL_DTS_SUBDIR="${{ env.KERNEL_DTS_SUBDIR }}"
          PATCH_NUMBER="${{ env.PATCH_NUMBER }}"
          PATCH_DESC="${{ env.PATCH_DESC }}"
          REF_DEVICE="${{ env.REF_DEVICE }}"
          MAKEFILE_BASE64="${{ env.MAKEFILE_BASE64 }}"
          
          echo "🔨 开始生成完整补丁..."
          
          # 解码Makefile内容（如果有）
          if [ -n "$MAKEFILE_BASE64" ]; then
            echo "$MAKEFILE_BASE64" | base64 -d > /tmp/decoded_makefile
            MAKE_FILE_CONTENT=$(cat /tmp/decoded_makefile)
          else
            MAKE_FILE_CONTENT=""
          fi
          
          # 处理每个DTS文件，生成一个补丁
          DTS_INDEX=0
          find "$DTS_SRC_DIR" -name "*.dts" | while read -r dts_file; do
            DTS_INDEX=$((DTS_INDEX + 1))
            filename=$(basename "$dts_file")
            dts_name="${filename%.dts}"
            
            # 生成补丁文件名（遵循Ophub命名规范）
            patch_name="${PATCH_NUMBER}-dts-add-${KERNEL_DTS_SUBDIR}-${dts_name}-dtb.patch"
            patch_path="$OPHUB_PATCH_DIR/$patch_name"
            
            # 计算DTS文件行数
            line_count=$(wc -l < "$dts_file")
            
            # 生成git补丁头
            commit_hash=$(date +%s | sha1sum | cut -c1-40)
            current_date=$(date -u '+%a, %d %b %Y %H:%M:%S +0000')
            
            # 分析Makefile，找到插入位置
            if [ -n "$MAKE_FILE_CONTENT" ]; then
              # 查找参考设备在Makefile中的位置
              ref_line=$(echo "$MAKE_FILE_CONTENT" | grep -n "+= $REF_DEVICE" | head -1 | cut -d: -f1)
              
              if [ -n "$ref_line" ]; then
                # 找到参考行，在该行后插入
                makefile_original="$MAKE_FILE_CONTENT"
                makefile_modified=$(echo "$makefile_original" | sed "${ref_line}a\\dtb-\\\$(CONFIG_ARCH_ROCKCHIP) += ${dts_name}.dtb")
                
                # 提取相关上下文（前后3行）
                context_start=$((ref_line > 3 ? ref_line - 3 : 1))
                context_end=$((ref_line + 3))
                
                # 生成Makefile差异
                makefile_diff=$(diff -u <(echo "$makefile_original" | sed -n "${context_start},${context_end}p") \
                                        <(echo "$makefile_modified" | sed -n "${context_start},${context_end}p"))
              else
                # 未找到参考行，在文件末尾添加
                makefile_original="$MAKE_FILE_CONTENT"
                makefile_modified="${makefile_original}"$'\n'"dtb-\$(CONFIG_ARCH_ROCKCHIP) += ${dts_name}.dtb"
                
                # 生成Makefile差异
                makefile_diff=$(diff -u <(echo "$makefile_original" | tail -5) <(echo "$makefile_modified" | tail -6))
              fi
            else
              # 没有Makefile内容，创建新的Makefile条目
              makefile_diff=$(cat << 'MAKEFILE_EOF'
--- /dev/null
+++ b/arch/arm64/boot/dts/rockchip/Makefile
@@ -0,0 +1 @@
+dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3568-hlink-h68ktv.dtb
MAKEFILE_EOF
)
              # 替换设备名称
              makefile_diff=$(echo "$makefile_diff" | sed "s/rk3568-hlink-h68ktv.dtb/${dts_name}.dtb/")
            fi
            
            # 生成完整的补丁文件 - 修复here-document问题
            cat > "$patch_path" << 'PATCH_EOF'
From __COMMIT_HASH__ Mon Sep 17 00:00:00 2001
From: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
Date: __CURRENT_DATE__
Subject: [PATCH] __PATCH_DESC__

---
 arch/arm64/boot/dts/__KERNEL_DTS_SUBDIR__/Makefile      |   1 +
 arch/arm64/boot/dts/__KERNEL_DTS_SUBDIR__/__FILENAME__   | __LINE_COUNT__ +
 2 files changed, __TOTAL_INSERTIONS__ insertions(+)
 create mode 100644 arch/arm64/boot/dts/__KERNEL_DTS_SUBDIR__/__FILENAME__

__MAKEFILE_DIFF__
diff --git a/arch/arm64/boot/dts/__KERNEL_DTS_SUBDIR__/__FILENAME__ b/arch/arm64/boot/dts/__KERNEL_DTS_SUBDIR__/__FILENAME__
new file mode 100644
index 000000000..__INDEX_HASH__
--- /dev/null
+++ b/arch/arm64/boot/dts/__KERNEL_DTS_SUBDIR__/__FILENAME__
@@ -0,0 +1,__LINE_COUNT__ @@
__DTS_CONTENT__
PATCH_EOF
            
            # 替换占位符
            total_insertions=$((line_count + 1))
            index_hash=$(date +%s | md5sum | cut -c1-12)
            
            # 读取DTS内容，每行前加+
            dts_content_with_plus=$(sed 's/^/+/' "$dts_file")
            
            # 替换所有占位符
            sed -i \
              -e "s|__COMMIT_HASH__|$commit_hash|g" \
              -e "s|__CURRENT_DATE__|$current_date|g" \
              -e "s|__PATCH_DESC__|$PATCH_DESC|g" \
              -e "s|__KERNEL_DTS_SUBDIR__|$KERNEL_DTS_SUBDIR|g" \
              -e "s|__FILENAME__|$filename|g" \
              -e "s|__LINE_COUNT__|$line_count|g" \
              -e "s|__TOTAL_INSERTIONS__|$total_insertions|g" \
              -e "s|__INDEX_HASH__|$index_hash|g" \
              -e "/__MAKEFILE_DIFF__/{
                  r /dev/stdin
                  d
                }" \
              -e "/__DTS_CONTENT__/{
                  r /dev/stdin
                  d
                }" \
              "$patch_path" <<EOF
$makefile_diff
$dts_content_with_plus
EOF
            
            echo "  ✅ 生成补丁：$patch_name"
            echo "     包含：Makefile修改 + ${dts_name}.dts (${line_count}行)"
          done
          
          echo ""
          echo "📊 生成完成：$DTS_INDEX 个完整补丁"

      - name: 6. 验证生成结果
        run: |
          OPHUB_PATCH_DIR="${{ env.OPHUB_PATCH_DIR }}"
          
          echo "🔍 验证补丁文件..."
          
          if [ ! -d "$OPHUB_PATCH_DIR" ]; then
            echo "❌ 错误：补丁目录 $OPHUB_PATCH_DIR 不存在"
            exit 1
          fi
          
          PATCH_FILES=($(find "$OPHUB_PATCH_DIR" -name "*.patch"))
          PATCH_COUNT=${#PATCH_FILES[@]}
          
          if [ $PATCH_COUNT -eq 0 ]; then
            echo "⚠️  警告：未生成任何补丁文件"
          else
            echo "✅ 找到 $PATCH_COUNT 个补丁文件"
            
            # 检查补丁格式
            for patch_file in "${PATCH_FILES[@]:0:2}"; do
              echo "📄 检查补丁：$(basename "$patch_file")"
              
              if head -n 1 "$patch_file" | grep -q "^From "; then
                echo "    ✅ 包含git补丁头"
              else
                echo "    ❌ 缺少git补丁头"
              fi
              
              if grep -q "Makefile" "$patch_file"; then
                echo "    ✅ 包含Makefile修改"
              else
                echo "    ❌ 缺少Makefile修改"
              fi
              
              if grep -q "\.dts" "$patch_file"; then
                echo "    ✅ 包含DTS文件"
              else
                echo "    ❌ 缺少DTS文件"
              fi
              
              echo "    补丁头预览："
              head -n 12 "$patch_file" | sed 's/^/      /'
            done
          fi
          
          echo ""
          echo "🎯 补丁存放位置：$OPHUB_PATCH_DIR"

      - name: 7. 提交补丁到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加补丁文件
          git add "${{ env.OPHUB_PATCH_DIR }}"/
          
          # 检查是否有更改
          if git diff --cached --quiet; then
            echo "ℹ️  无新补丁文件，无需提交"
          else
            # 显示将要提交的文件
            echo "📋 将要提交的文件："
            git diff --cached --name-only
            
            # 提交
            COMMIT_MSG="完整DTS补丁: ${{ env.DIR_NAME }} | 内核子目录: ${{ env.KERNEL_DTS_SUBDIR }} | 编号: ${{ env.PATCH_NUMBER }}"
            git commit -m "$COMMIT_MSG"
            
            # 推送到仓库
            git push origin main
            echo "✅ 补丁已提交并推送到仓库"
          fi
