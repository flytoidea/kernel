# 手动触发 | 智能生成完整设备树补丁
name: 智能生成设备树补丁
on:
  workflow_dispatch:
    inputs:
      dts_source_dir:
        description: '选择DTS源目录（需与Ophub目录名一致）'
        required: true
        type: choice
        default: 'custom-dts/linux-6.1.y'
        options:
          - custom-dts/linux-5.10.y
          - custom-dts/linux-5.15.y
          - custom-dts/linux-6.1.y
          - custom-dts/linux-6.6.y
          - custom-dts/linux-6.12.y
          - custom-dts/common-kernel-patches
      kernel_dts_subdir:
        description: '内核DTS子目录（如rockchip、amlogic）'
        required: true
        default: 'rockchip'
        type: string
      patch_number:
        description: '补丁编号（DTS补丁用300系列）'
        required: true
        default: '301'
        type: string

permissions:
  contents: write

jobs:
  generate-intelligent-patch:
    runs-on: ubuntu-latest
    env:
      DTS_SRC_DIR: ${{ github.event.inputs.dts_source_dir }}
      KERNEL_DTS_SUBDIR: ${{ github.event.inputs.kernel_dts_subdir }}
      PATCH_NUMBER: ${{ github.event.inputs.patch_number }}
      OPHUB_BETA_ROOT: 'kernel-patch/beta'

    steps:
      - name: 1. 拉取仓库最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 2. 安装Python依赖
        run: |
          python3 -m pip install requests

      - name: 3. 准备环境
        run: |
          # 提取目录名
          DIR_NAME=$(basename $DTS_SRC_DIR)
          echo "DIR_NAME=$DIR_NAME" >> $GITHUB_ENV
          
          # 设置补丁输出目录
          OPHUB_PATCH_DIR="${{ env.OPHUB_BETA_ROOT }}/$DIR_NAME"
          echo "OPHUB_PATCH_DIR=$OPHUB_PATCH_DIR" >> $GITHUB_ENV
          
          # 创建目录
          mkdir -p "$OPHUB_PATCH_DIR"
          
          echo "📁 环境信息："
          echo "  DTS源目录：$DTS_SRC_DIR"
          echo "  补丁目录：$OPHUB_PATCH_DIR"
          echo "  内核子目录：$KERNEL_DTS_SUBDIR"
          echo "  补丁编号：$PATCH_NUMBER"

      - name: 4. 使用Python脚本智能生成补丁
        run: |
          cd "${{ github.workspace }}"
          
          # 创建Python脚本，使用不同的定界符避免嵌套引号问题
          cat > generate_intelligent_patch.py << 'PYTHON_EOF'
#!/usr/bin/env python3
import os
import re
import sys
import requests
from datetime import datetime, timezone

def get_unifreq_makefile_url(kernel_version, dts_subdir):
    """根据内核版本和子目录构造Makefile URL"""
    # 从内核版本目录名提取版本号（如linux-6.1.y -> 6.1.y）
    version = kernel_version.replace('linux-', '')
    
    # 构建仓库名
    repo_name = f"linux-{version}-{dts_subdir}"
    
    # 构建URL
    url = f"https://raw.githubusercontent.com/unifreq/{repo_name}/main/arch/arm64/boot/dts/{dts_subdir}/Makefile"
    return url

def find_insert_position(makefile_content, new_dtb_name):
    """在Makefile中找到合适的插入位置"""
    lines = makefile_content.splitlines()
    
    # 提取设备系列（如rk3568-hlink-h68ktv -> rk3568）
    device_series = new_dtb_name.split('-')[0] + '-'
    
    # 找出所有相关条目的行号
    relevant_lines = []
    for i, line in enumerate(lines):
        if "dtb-\$(CONFIG_ARCH_" in line and device_series in line:
            # 提取当前行的dtb名称
            match = re.search(r'\+= (\S+)\.dtb', line)
            if match:
                current_dtb = match.group(1)
                relevant_lines.append((i, current_dtb))
    
    if not relevant_lines:
        # 如果没有找到同系列设备，找到第一个dtb行插入
        for i, line in enumerate(lines):
            if "dtb-\$(CONFIG_ARCH_" in line:
                print(f"  📍 未找到同系列设备，将在第{i+1}行后插入")
                return i + 1
        # 如果也没有dtb行，插入到文件末尾
        print(f"  📍 未找到任何dtb行，将插入到文件末尾")
        return len(lines)
    
    # 按字母顺序排序现有的dtb名称
    relevant_lines.sort(key=lambda x: x[1])
    
    # 找到新dtb应该插入的位置
    for i, (line_num, current_dtb) in enumerate(relevant_lines):
        if new_dtb_name < current_dtb:
            print(f"  📍 按字母顺序插入在第{line_num+1}行前（在{current_dtb}之前）")
            return line_num
        elif i == len(relevant_lines) - 1:
            # 如果新dtb比所有现有的大，插入在最后一个之后
            print(f"  📍 插入在第{line_num+1}行后（在{current_dtb}之后）")
            return line_num + 1
    
    # 默认插入到第一个相关行之后
    return relevant_lines[0][0] + 1

def get_config_prefix(dts_subdir):
    """根据子目录获取CONFIG_ARCH_前缀"""
    config_map = {
        'rockchip': 'ROCKCHIP',
        'amlogic': 'MESON',
        'sunxi': 'SUNXI',
        'allwinner': 'SUNXI',
        'mediatek': 'MEDIATEK',
    }
    return config_map.get(dts_subdir.lower(), dts_subdir.upper())

def create_patch_file(dts_file_path, dts_subdir, patch_number, output_dir):
    """生成完整的补丁文件"""
    # 读取DTS文件
    with open(dts_file_path, 'r', encoding='utf-8') as f:
        dts_content = f.read()
    
    dts_filename = os.path.basename(dts_file_path)
    dts_basename = os.path.splitext(dts_filename)[0]
    dtb_name = f"{dts_basename}.dtb"
    
    print(f"🔄 处理DTS文件: {dts_filename}")
    
    # 获取内核版本
    kernel_version = os.environ.get('DIR_NAME', 'linux-6.1.y')
    
    # 下载Makefile
    makefile_url = get_unifreq_makefile_url(kernel_version, dts_subdir)
    print(f"  📥 下载Makefile: {makefile_url}")
    
    try:
        response = requests.get(makefile_url, timeout=10)
        response.raise_for_status()
        makefile_content = response.text
    except Exception as e:
        print(f"  ❌ 下载Makefile失败: {e}")
        print(f"  ℹ️ 使用模拟Makefile")
        # 创建一个简单的Makefile模板
        makefile_content = f"# Makefile for {dts_subdir}\n# Auto-generated when real Makefile not available\n"
    
    # 找到插入位置
    insert_line = find_insert_position(makefile_content, dts_basename)
    
    # 分割Makefile行
    makefile_lines = makefile_content.splitlines()
    
    # 创建修改后的Makefile
    new_makefile_lines = makefile_lines.copy()
    config_prefix = get_config_prefix(dts_subdir)
    new_line = f"dtb-$(CONFIG_ARCH_{config_prefix}) += {dtb_name}"
    new_makefile_lines.insert(insert_line, new_line)
    
    # 计算行数
    dts_line_count = len(dts_content.splitlines())
    total_insertions = dts_line_count + 1
    
    # 生成补丁内容
    patch_lines = []
    
    # Git补丁头
    now = datetime.now(timezone.utc)
    commit_hash = format(int(now.timestamp()), 'x')
    
    patch_lines.extend([
        f"From {commit_hash} Mon Sep 17 00:00:00 2001",
        f"From: github-actions[bot] <github-actions[bot]@users.noreply.github.com>",
        f"Date: {now.strftime('%a, %d %b %Y %H:%M:%S +0000')}",
        f"Subject: [PATCH] Add {dts_basename}",
        "",
        "---",
        f" arch/arm64/boot/dts/{dts_subdir}/Makefile         |   1 +",
        f" arch/arm64/boot/dts/{dts_subdir}/{dts_filename}  |   {dts_line_count} +",
        f" 2 files changed, {total_insertions} insertions(+)",
        f" create mode 100644 arch/arm64/boot/dts/{dts_subdir}/{dts_filename}",
        "",
        f"diff --git a/arch/arm64/boot/dts/{dts_subdir}/Makefile b/arch/arm64/boot/dts/{dts_subdir}/Makefile",
        f"index 0000000..1111111 100644",
        f"--- a/arch/arm64/boot/dts/{dts_subdir}/Makefile",
        f"+++ b/arch/arm64/boot/dts/{dts_subdir}/Makefile",
    ])
    
    # 生成Makefile的diff
    # 找到上下文行
    context_start = max(0, insert_line - 3)
    context_end = min(len(makefile_lines), insert_line + 2)
    
    # 计算diff的行范围
    old_start = context_start + 1
    old_count = context_end - context_start
    new_start = old_start
    new_count = old_count + 1  # 因为我们插入了一行
    
    patch_lines.append(f"@@ -{old_start},{old_count} +{new_start},{new_count} @@")
    
    # 添加上下文
    for i in range(context_start, insert_line):
        if i < len(makefile_lines):
            patch_lines.append(f" {makefile_lines[i]}")
    
    # 添加新行
    patch_lines.append(f"+{new_line}")
    
    # 添加后续上下文
    for i in range(insert_line, min(len(makefile_lines), context_end)):
        patch_lines.append(f" {makefile_lines[i]}")
    
    # 添加DTS文件的diff
    patch_lines.extend([
        "",
        f"diff --git a/arch/arm64/boot/dts/{dts_subdir}/{dts_filename} b/arch/arm64/boot/dts/{dts_subdir}/{dts_filename}",
        "new file mode 100644",
        "index 0000000..1111111",
        "--- /dev/null",
        f"+++ b/arch/arm64/boot/dts/{dts_subdir}/{dts_filename}",
        f"@@ -0,0 +1,{dts_line_count} @@",
    ])
    
    # 添加DTS内容（每行前加+）
    for line in dts_content.splitlines():
        patch_lines.append(f"+{line}")
    
    # 生成补丁文件名
    patch_filename = f"{patch_number}-dts-add-{dts_subdir}-{dts_basename}-dtb.patch"
    patch_path = os.path.join(output_dir, patch_filename)
    
    # 写入补丁文件
    with open(patch_path, 'w', encoding='utf-8') as f:
        f.write('\n'.join(patch_lines))
    
    print(f"  ✅ 生成补丁: {patch_filename}")
    print(f"  📍 插入位置: 第{insert_line+1}行")
    print(f"  📝 添加的条目: {new_line}")
    
    return patch_path

def main():
    # 获取环境变量
    dts_src_dir = os.environ.get('DTS_SRC_DIR', '')
    dts_subdir = os.environ.get('KERNEL_DTS_SUBDIR', 'rockchip')
    patch_number_str = os.environ.get('PATCH_NUMBER', '301')
    output_dir = os.environ.get('OPHUB_PATCH_DIR', '')
    
    if not dts_src_dir or not output_dir:
        print("❌ 缺少必要环境变量")
        print(f"DTS_SRC_DIR: {dts_src_dir}")
        print(f"OPHUB_PATCH_DIR: {output_dir}")
        sys.exit(1)
    
    # 将补丁编号转为整数
    try:
        base_patch_number = int(patch_number_str)
    except ValueError:
        print(f"❌ 补丁编号必须为数字: {patch_number_str}")
        base_patch_number = 301
    
    # 查找所有DTS文件
    dts_files = []
    for root, dirs, files in os.walk(dts_src_dir):
        for file in files:
            if file.endswith('.dts'):
                dts_files.append(os.path.join(root, file))
    
    if not dts_files:
        print("❌ 未找到DTS文件")
        sys.exit(1)
    
    print(f"📁 找到 {len(dts_files)} 个DTS文件")
    
    # 为每个DTS文件生成补丁
    for i, dts_file in enumerate(sorted(dts_files)):
        # 递增编号
        current_patch_num = str(base_patch_number + i)
        
        patch_path = create_patch_file(
            dts_file, 
            dts_subdir, 
            current_patch_num,
            output_dir
        )
        
        print(f"✅ 第{i+1}个补丁已生成: {os.path.basename(patch_path)}")
    
    print(f"🎉 所有补丁生成完成，共{len(dts_files)}个")

if __name__ == "__main__":
    main()
PYTHON_EOF
          
          # 运行Python脚本
          python3 generate_intelligent_patch.py
          
          echo "🎉 Python脚本执行完成"

      - name: 5. 验证生成的补丁
        run: |
          OPHUB_PATCH_DIR="${{ env.OPHUB_PATCH_DIR }}"
          
          echo "🔍 验证补丁文件..."
          
          if [ ! -d "$OPHUB_PATCH_DIR" ]; then
            echo "❌ 补丁目录不存在"
            exit 1
          fi
          
          # 检查是否有补丁文件生成
          PATCH_COUNT=$(find "$OPHUB_PATCH_DIR" -name "*.patch" 2>/dev/null | wc -l)
          
          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "❌ 未生成任何补丁文件"
            exit 1
          fi
          
          echo "📄 生成的补丁列表（共 $PATCH_COUNT 个）："
          find "$OPHUB_PATCH_DIR" -name "*.patch" | while read patch; do
            patch_name=$(basename "$patch")
            echo "  📝 $patch_name"
            
            # 检查补丁头
            if head -n 1 "$patch" | grep -q "^From "; then
              echo "    ✅ 包含git补丁头"
            else
              echo "    ❌ 缺少git补丁头"
            fi
            
            # 检查是否包含Makefile修改
            if grep -q "Makefile" "$patch"; then
              echo "    ✅ 包含Makefile修改"
              # 显示添加的行
              added_line=$(grep "^+dtb-" "$patch" | head -1)
              if [ -n "$added_line" ]; then
                echo "    📋 添加的条目: ${added_line:1}"
              fi
            else
              echo "    ❌ 缺少Makefile修改"
            fi
            
            # 检查是否包含DTS文件
            if grep -q "\.dts" "$patch"; then
              echo "    ✅ 包含DTS文件"
            else
              echo "    ❌ 缺少DTS文件"
            fi
            
            # 显示文件大小
            file_size=$(wc -l < "$patch")
            echo "    📏 补丁行数: $file_size"
          done

      - name: 6. 提交补丁到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加补丁文件
          git add "${{ env.OPHUB_PATCH_DIR }}"/
          
          # 检查是否有更改
          if git diff --cached --quiet; then
            echo "ℹ️ 无新补丁，无需提交"
          else
            # 显示更改
            echo "📋 提交的文件："
            git diff --cached --name-only
            
            # 提交
            COMMIT_MSG="智能DTS补丁: ${{ env.DIR_NAME }} | 内核子目录: ${{ env.KERNEL_DTS_SUBDIR }} | 补丁数: $(find "${{ env.OPHUB_PATCH_DIR }}" -name "*.patch" 2>/dev/null | wc -l)"
            git commit -m "$COMMIT_MSG"
            
            # 推送到仓库
            git push origin main
            echo "✅ 补丁已提交并推送"
          fi
