# 手动触发 | 直接目录映射：custom-dts/[目录名] → kernel-patch/beta/[目录名]
# DTS源(内核版本)下拉选择 | 内核子目录手动输入(默认rockchip)
name: 生成设备树补丁
on:
  workflow_dispatch:
    inputs:
      # 下拉选择：DTS源目录（与ophub beta子目录名完全一致）
      dts_source_dir:
        description: '选择DTS源目录（仓库内，与ophub beta子目录名一致）'
        required: true
        type: choice
        default: 'custom-dts/common-kernel-patches'
        options:
          - custom-dts/linux-5.10.y
          - custom-dts/linux-5.15.y
          - custom-dts/linux-6.1.y
          - custom-dts/linux-6.6.y
          - custom-dts/linux-6.12.y  
          - custom-dts/common-kernel-patches
      # 手动输入：内核DTS子目录（默认rockchip，匹配unifreq dts子目录）
      kernel_dts_subdir:
        description: '输入内核DTS子目录（如rockchip、sunxi、amlogic，默认rockchip）'
        required: true
        default: 'rockchip'
        type: string

# 权限：允许提交补丁到仓库
permissions:
  contents: write

jobs:
  dts2patch-final:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      DTS_SRC_DIR: ${{ github.event.inputs.dts_source_dir }}
      KERNEL_DTS_SUBDIR: ${{ github.event.inputs.kernel_dts_subdir }}
      OPHUB_BETA_ROOT: 'kernel-patch/beta'  # ophub beta根目录

    steps:
      - name: 1. 拉取仓库最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史记录
          persist-credentials: true

      - name: 2. 提取目录名并验证
        run: |
          # 提取纯目录名（custom-dts/linux-5.15.y → linux-5.15.y）
          DIR_NAME=$(basename $DTS_SRC_DIR)
          echo "DIR_NAME=$DIR_NAME" >> $GITHUB_ENV
          
          # 直接映射：DTS源目录名 = Ophub补丁目录名
          OPHUB_PATCH_DIR="${{ env.OPHUB_BETA_ROOT }}/$DIR_NAME"
          echo "OPHUB_PATCH_DIR=$OPHUB_PATCH_DIR" >> $GITHUB_ENV
          
          echo "📁 目录映射规则："
          echo "  DTS源目录：$DTS_SRC_DIR"
          echo "  → 补丁目录：$OPHUB_PATCH_DIR"
          
          # 校验DTS源目录有效性
          if [ ! -d "$DTS_SRC_DIR" ]; then
            echo "❌ 错误：DTS源目录 $DTS_SRC_DIR 不存在"
            echo "  请先创建目录并上传.dts文件"
            exit 1
          fi
          
          # 检查是否有.dts或.dtsi文件
          if ! find "$DTS_SRC_DIR" -name "*.dts" -o -name "*.dtsi" | grep -q .; then
            echo "❌ 错误：DTS源目录 $DTS_SRC_DIR 下无.dts或.dtsi文件"
            echo "  请在目录中添加设备树文件"
            exit 1
          fi
          
          DTS_COUNT=$(find "$DTS_SRC_DIR" \( -name "*.dts" -o -name "*.dtsi" \) | wc -l)
          echo "✅ 检测到 $DTS_COUNT 个DTS文件"

      - name: 3. 生成补丁文件
        run: |
          # 创建输出目录
          mkdir -p "${{ env.OPHUB_PATCH_DIR }}"
          
          # 获取变量
          DTS_SRC_DIR="${{ env.DTS_SRC_DIR }}"
          OPHUB_PATCH_DIR="${{ env.OPHUB_PATCH_DIR }}"
          KERNEL_DTS_SUBDIR="${{ env.KERNEL_DTS_SUBDIR }}"
          
          echo "🔨 开始生成补丁..."
          echo "  源目录：$DTS_SRC_DIR"
          echo "  目标目录：$OPHUB_PATCH_DIR"
          echo "  内核子目录：$KERNEL_DTS_SUBDIR"
          
          # 计数器
          SUCCESS_COUNT=0
          ERROR_COUNT=0
          
          # 处理每个DTS文件
          find "$DTS_SRC_DIR" -type f \( -name "*.dts" -o -name "*.dtsi" \) | while read -r dts_file; do
            filename=$(basename "$dts_file")
            patch_name="${filename}.patch"
            patch_path="$OPHUB_PATCH_DIR/$patch_name"
            
            # 计算行数
            line_count=$(wc -l < "$dts_file")
            
            # 生成补丁
            {
              echo "--- /dev/null"
              echo "+++ b/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/$filename"
              echo "@@ -0,0 +1,$line_count @@"
              # 添加DTS内容，每行前加+
              sed 's/^/+/' "$dts_file"
            } > "$patch_path"
            
            # 验证补丁是否成功生成
            if [ -s "$patch_path" ]; then
              echo "  ✅ $(basename "$patch_path") (${line_count}行)"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "  ❌ $(basename "$patch_path") (生成失败)"
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done
          
          echo ""
          echo "📊 生成结果："
          echo "  ✅ 成功：$SUCCESS_COUNT 个"
          if [ $ERROR_COUNT -gt 0 ]; then
            echo "  ❌ 失败：$ERROR_COUNT 个"
            exit 1
          fi

      - name: 4. 验证生成结果
        run: |
          OPHUB_PATCH_DIR="${{ env.OPHUB_PATCH_DIR }}"
          KERNEL_DTS_SUBDIR="${{ env.KERNEL_DTS_SUBDIR }}"
          
          echo "🔍 验证补丁文件..."
          
          # 检查目录是否存在
          if [ ! -d "$OPHUB_PATCH_DIR" ]; then
            echo "❌ 错误：补丁目录 $OPHUB_PATCH_DIR 不存在"
            exit 1
          fi
          
          # 统计补丁文件
          PATCH_FILES=($(find "$OPHUB_PATCH_DIR" -name "*.patch"))
          PATCH_COUNT=${#PATCH_FILES[@]}
          
          if [ $PATCH_COUNT -eq 0 ]; then
            echo "⚠️  警告：未生成任何补丁文件"
          else
            echo "✅ 找到 $PATCH_COUNT 个补丁文件"
            
            # 随机检查几个文件的格式
            echo "📝 随机检查文件格式..."
            for patch_file in "${PATCH_FILES[@]:0:3}"; do
              echo "  📄 $(basename "$patch_file")"
              
              # 检查文件头
              if head -n 1 "$patch_file" | grep -q "^--- /dev/null"; then
                echo "    ✅ 补丁头正确"
              else
                echo "    ❌ 补丁头错误"
              fi
              
              # 检查路径是否正确包含内核子目录
              if head -n 2 "$patch_file" | tail -n 1 | grep -q "b/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/"; then
                echo "    ✅ 内核路径正确"
              else
                echo "    ❌ 内核路径错误"
              fi
            done
          fi
          
          echo ""
          echo "🎯 补丁存放位置：$OPHUB_PATCH_DIR"

      - name: 5. 提交补丁到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加补丁文件
          git add "${{ env.OPHUB_PATCH_DIR }}"/
          
          # 检查是否有更改
          if git diff --cached --quiet; then
            echo "ℹ️  无新补丁文件，无需提交"
          else
            # 显示将要提交的文件
            echo "📋 将要提交的文件："
            git diff --cached --name-only
            
            # 提交
            COMMIT_MSG="DTS2Patch: ${{ env.DIR_NAME }} | 内核子目录：${{ env.KERNEL_DTS_SUBDIR }}"
            git commit -m "$COMMIT_MSG"
            
            # 推送到仓库
            git push origin main
            echo "✅ 补丁已提交并推送到仓库"
          fi
