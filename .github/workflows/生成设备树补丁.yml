# 手动触发-指定路径DTS转ophub规范补丁
name: 生成设备数补丁
# 仅手动触发，取消所有自动触发条件
on:
  workflow_dispatch:
    inputs:
      # 手动输入参数：指定要转换的DTS目录（仓库内相对路径）
      dts_dir:
        description: '指定DTS所在目录（仓库内相对路径，如custom-dts/5.15.y）'
        required: true
        default: 'custom-dts/5.15.y'
        type: string
      # 固定内核DTS子目录（RK3568专属，无需修改）
      kernel_dts_subdir:
        description: '内核DTS子目录（RK3568填rockchip，无需改）'
        required: true
        default: 'rockchip'
        type: string

# 权限：允许提交补丁到仓库
permissions:
  contents: write

jobs:
  dts2patch-manual:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      # 从手动输入参数获取值，传递到后续步骤
      DTS_TARGET_DIR: ${{ github.event.inputs.dts_dir }}
      KERNEL_DTS_SUBDIR: ${{ github.event.inputs.kernel_dts_subdir }}
      PATCH_OUTPUT_ROOT: 'kernel-patch/beta'
    steps:
      - name: 1. 拉取仓库最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: 2. 检查指定的DTS目录是否存在
        run: |
          if [ ! -d "$DTS_TARGET_DIR" ]; then
            echo "❌ 错误：指定的DTS目录 $DTS_TARGET_DIR 不存在！"
            exit 1
          fi
          if [ -z "$(ls -A $DTS_TARGET_DIR/*.dts 2>/dev/null)" ]; then
            echo "❌ 错误：指定的DTS目录 $DTS_TARGET_DIR 下无.dts文件！"
            exit 1
          fi
          echo "✅ 检测到有效DTS目录：$DTS_TARGET_DIR"
          # 从DTS路径提取内核版本（如custom-dts/5.15.y → 5.15.y）
          KERNEL_VER=$(basename $DTS_TARGET_DIR)
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
          echo "✅ 提取内核版本：$KERNEL_VER"

      - name: 3. 生成ophub规范纯新增补丁
        run: |
          # 定义补丁输出目录（kernel-patch/beta/5.15.y）
          PATCH_OUTPUT_DIR="${{ env.PATCH_OUTPUT_ROOT }}/${{ env.KERNEL_VER }}"
          mkdir -p $PATCH_OUTPUT_DIR
          # 新建临时目录：模拟官方空目录（original）、修改后目录（modified）
          TEMP_ORI="temp/original/${{ env.KERNEL_DTS_SUBDIR }}"
          TEMP_MOD="temp/modified/${{ env.KERNEL_DTS_SUBDIR }}"
          mkdir -p $TEMP_ORI $TEMP_MOD

          # 遍历指定目录下所有DTS，批量生成补丁
          for dts_file in ${{ env.DTS_TARGET_DIR }}/*.dts; do
            dts_name=$(basename $dts_file)
            patch_name="${dts_name%.dts}.dts.patch"
            # 复制DTS到修改后目录，原始目录保持空（生成纯新增补丁）
            cp $dts_file $TEMP_MOD/
            # 核心diff命令：生成unified格式补丁
            diff -Naur temp/original/ temp/modified/ > $PATCH_OUTPUT_DIR/$patch_name
            # 清理补丁中临时目录路径，匹配ophub编译规范
            sed -i "s|temp/original/${{ env.KERNEL_DTS_SUBDIR }}/|${{ env.KERNEL_DTS_SUBDIR }}/|g" $PATCH_OUTPUT_DIR/$patch_name
            sed -i "s|temp/modified/${{ env.KERNEL_DTS_SUBDIR }}/|${{ env.KERNEL_DTS_SUBDIR }}/|g" $PATCH_OUTPUT_DIR/$patch_name
            # 强制UTF-8编码，避免编译乱码
            iconv -f utf-8 -t utf-8 -c $PATCH_OUTPUT_DIR/$patch_name > $PATCH_OUTPUT_DIR/$patch_name.utf8
            mv $PATCH_OUTPUT_DIR/$patch_name.utf8 $PATCH_OUTPUT_DIR/$patch_name
            echo "✅ 生成补丁：$PATCH_OUTPUT_DIR/$patch_name"
          done

          # 清理临时文件
          rm -rf temp/
          echo "✅ 所有DTS补丁生成完成！"

      - name: 4. 自动提交补丁到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 添加补丁文件
          git add ${{ env.PATCH_OUTPUT_ROOT }}/**/*.patch
          # 提交（无新文件则跳过）
          git commit -m "Manual generate DTS patch: ${{ env.DTS_TARGET_DIR }} → ${{ env.PATCH_OUTPUT_ROOT }}/${{ env.KERNEL_VER }} [$(date +%Y-%m-%d %H:%M:%S)]" || echo "ℹ 无新补丁需要提交"
          # 推送到仓库主分支（非main分支请改为master）
          git push origin main || echo "ℹ 无新补丁需要推送"
