name: 生成设备树补丁
on:
  workflow_dispatch:
    inputs:
      dts_source_dir:
        description: '选择DTS源目录（仓库内，内核版本/通用补丁）'
        required: true
        type: choice
        default: 'custom-dts/common-kernel-patches'
        options:
          - custom-dts/5.10.y
          - custom-dts/5.15.y
          - custom-dts/6.1.y
          - custom-dts/6.6.y
          - custom-dts/6.12.y
          - custom-dts/common-kernel-patches
      kernel_dts_subdir:
        description: '输入内核DTS子目录（如rockchip、sunxi、amlogic，默认rockchip）'
        required: true
        default: 'rockchip'
        type: string

permissions:
  contents: write

jobs:
  dts2patch-final:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      DTS_SRC_DIR: ${{ github.event.inputs.dts_source_dir }}
      KERNEL_DTS_SUBDIR: ${{ github.event.inputs.kernel_dts_subdir }}
      OPHUB_BETA_ROOT: 'kernel-patch/beta'
      UNIFREQ_DTS_ROOT: 'arch/arm64/boot/dts'

    steps:
      - name: 1. 拉取仓库最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: 2. 仅保留必要校验（DTS存在即放行）
        run: |
          # 目录匹配逻辑不变，直接映射ophub目录
          SRC_DIR_NAME=$(basename $DTS_SRC_DIR)
          OPHUB_PATCH_DIR="${{ env.OPHUB_BETA_ROOT }}/$([ "$SRC_DIR_NAME" == "common-kernel-patches" ] && echo "common-kernel-patches" || echo "linux-$SRC_DIR_NAME")"
          echo "OPHUB_PATCH_DIR=$OPHUB_PATCH_DIR" >> $GITHUB_ENV
          echo "✅ 补丁输出目录：$OPHUB_PATCH_DIR"

          # 仅校验DTS文件存在（解决你说的「DTS存在却空补丁」前提）
          if [ ! -d "$DTS_SRC_DIR" ]; then
            echo "❌ 错误：DTS源目录 $DTS_SRC_DIR 不存在"
            exit 1
          fi
          DTS_FILES=($DTS_SRC_DIR/*.dts)
          if [ ${#DTS_FILES[@]} -eq 0 ] || [ ! -f "${DTS_FILES[0]}" ]; then
            echo "❌ 错误：DTS源目录下无有效.dts文件"
            exit 1
          fi
          echo "✅ 检测到 ${#DTS_FILES[@]} 个有效DTS文件：${DTS_FILES[@]##*/}"

      - name: 3. 核心修复：DTS存在时生成非空补丁
        run: |
          mkdir -p ${{ env.OPHUB_PATCH_DIR }}

          # 关键修复1：模拟内核目录时确保路径无空格/特殊字符
          TEMP_ORI=$(mktemp -d -t kernel-dts-ori-XXXXXX)
          TEMP_MOD=$(mktemp -d -t kernel-dts-mod-XXXXXX)
          mkdir -p "$TEMP_ORI/$UNIFREQ_DTS_ROOT/$KERNEL_DTS_SUBDIR" "$TEMP_MOD/$UNIFREQ_DTS_ROOT/$KERNEL_DTS_SUBDIR"

          for dts_file in "${DTS_FILES[@]}"; do
            dts_name=$(basename $dts_file)
            patch_name="${dts_name%.dts}.dts.patch"
            patch_path="${{ env.OPHUB_PATCH_DIR }}/$patch_name"

            # 关键修复2：强制复制DTS到模拟目录，确保文件可读
            cp -f "$dts_file" "$TEMP_MOD/$UNIFREQ_DTS_ROOT/$KERNEL_DTS_SUBDIR/"
            chmod 644 "$TEMP_MOD/$UNIFREQ_DTS_ROOT/$KERNEL_DTS_SUBDIR/$dts_name"

            # 关键修复3：优化diff参数，确保捕捉文件内容
            diff -Naur --new-file --binary --no-dereference \
              "$TEMP_ORI/$UNIFREQ_DTS_ROOT" \
              "$TEMP_MOD/$UNIFREQ_DTS_ROOT" > "$patch_path"

            # 最终校验：补丁非空才放行（解决核心问题）
            if [ ! -s "$patch_path" ]; then
              echo "❌ 错误：DTS文件存在，但生成的补丁 $patch_name 为空（检查DTS文件是否有有效内容）"
              cat "$dts_file"  # 输出DTS内容供排查
              exit 1
            fi

            # 编码处理不变，仅保证兼容
            iconv -f utf-8 -t utf-8 -c "$patch_path" > "$patch_path.utf8"
            mv -f "$patch_path.utf8" "$patch_path"
            echo "✅ 生成非空补丁：$patch_name（大小：$(du -sh "$patch_path" | awk '{print $1}')）"
          done

          # 清理临时目录
          rm -rf "$TEMP_ORI" "$TEMP_MOD"
          echo -e "\n🎉 补丁生成完成！存放于 ${{ env.OPHUB_PATCH_DIR }}"

      - name: 4. 自动提交补丁（逻辑不变）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.OPHUB_BETA_ROOT }}/**/*.patch
          git commit -m "DTS2Patch: 修复空补丁 | 有效DTS数：${#DTS_FILES[@]}" || echo "ℹ 无新补丁需提交"
          git push origin main || echo "ℹ 无新补丁需推送"
