# 手动触发 | 生成完整设备树补丁（含Makefile修改）
name: 生成完整设备树补丁
on:
  workflow_dispatch:
    inputs:
      dts_source_dir:
        description: '选择DTS源目录（该目录与内核补丁下beta子目录名对应）'
        required: true
        type: choice
        default: 'custom-dts/linux-6.12.y'
        options:
          - custom-dts/linux-5.10.y
          - custom-dts/linux-5.15.y
          - custom-dts/linux-6.1.y
          - custom-dts/linux-6.6.y
          - custom-dts/linux-6.12.y
      kernel_dts_subdir:
        description: '输入内核DTS子目录（如rockchip、sunxi、amlogic，匹配soc型号用）'
        required: true
        default: 'rockchip'
        type: string
      makefile_insert_line:
        description: 'Makefile插入的条目（如：dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3568-hlink-h68ktv.dtb）'
        required: true
        default: 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3568-hlink-h68ktv.dtb'
        type: string
      insert_after_line:
        description: 'Makefile中要插入在哪个条目之后（用于定位，如：rk3568-fastrhino-r66s.dtb）'
        required: true
        default: 'rk3568-fastrhino-r66s.dtb'
        type: string

permissions:
  contents: write

jobs:
  dts2patch-final:
    runs-on: ubuntu-latest
    env:
      DTS_SRC_DIR: ${{ github.event.inputs.dts_source_dir }}
      KERNEL_DTS_SUBDIR: ${{ github.event.inputs.kernel_dts_subdir }}
      MAKEFILE_INSERT_LINE: ${{ github.event.inputs.makefile_insert_line }}
      INSERT_AFTER_LINE: ${{ github.event.inputs.insert_after_line }}
      OPHUB_BETA_ROOT: 'kernel-patch/beta'

    steps:
      - name: 1. 拉取仓库最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 2. 提取目录名并验证
        run: |
          DIR_NAME=$(basename $DTS_SRC_DIR)
          echo "DIR_NAME=$DIR_NAME" >> $GITHUB_ENV
          
          OPHUB_PATCH_DIR="${{ env.OPHUB_BETA_ROOT }}/$DIR_NAME"
          echo "OPHUB_PATCH_DIR=$OPHUB_PATCH_DIR" >> $GITHUB_ENV
          
          echo "📁 目录映射：$DTS_SRC_DIR → $OPHUB_PATCH_DIR"
          
          if [ ! -d "$DTS_SRC_DIR" ]; then
            echo "❌ 错误：DTS源目录 $DTS_SRC_DIR 不存在"
            exit 1
          fi
          
          DTS_FILES=($(find "$DTS_SRC_DIR" -name "*.dts"))
          if [ ${#DTS_FILES[@]} -eq 0 ]; then
            echo "❌ 错误：未找到.dts文件"
            exit 1
          fi
          echo "✅ 找到 ${#DTS_FILES[@]} 个DTS文件"

      - name: 3. 为每个DTS生成完整补丁
        run: |
          # 设置变量
          DTS_SRC_DIR="${{ env.DTS_SRC_DIR }}"
          OPHUB_PATCH_DIR="${{ env.OPHUB_PATCH_DIR }}"
          KERNEL_DTS_SUBDIR="${{ env.KERNEL_DTS_SUBDIR }}"
          MAKEFILE_INSERT_LINE="${{ env.MAKEFILE_INSERT_LINE }}"
          INSERT_AFTER_LINE="${{ env.INSERT_AFTER_LINE }}"
          
          # 创建输出目录
          mkdir -p "$OPHUB_PATCH_DIR"
          
          echo "🔨 开始生成完整补丁（包含Makefile修改）..."
          echo "  内核子目录：$KERNEL_DTS_SUBDIR"
          echo "  Makefile插入行：$MAKEFILE_INSERT_LINE"
          echo "  插入位置：在 $INSERT_AFTER_LINE 之后"
          
          # 处理每个DTS文件
          find "$DTS_SRC_DIR" -name "*.dts" | while read -r dts_file; do
            filename=$(basename "$dts_file")
            dts_name="${filename%.dts}"
            
            echo "处理：$dts_name"
            
            # 生成补丁编号（从301开始）
            # 这里简单处理，实际可以根据目录中现有补丁编号自动递增
            PATCH_NUMBER="301"
            
            # 生成补丁文件名（按照规范）
            patch_name="${PATCH_NUMBER}-dts-add-${KERNEL_DTS_SUBDIR}-${dts_name}-dtb.patch"
            patch_path="$OPHUB_PATCH_DIR/$patch_name"
            
            # 获取DTS文件行数
            line_count=$(wc -l < "$dts_file")
            
            # 计算Makefile行数（假设在指定条目后插入）
            # 这里我们模拟Makefile的修改
            makefile_lines=(
              "--- a/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/Makefile"
              "+++ b/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/Makefile"
              "@@ -X,Y +X,Z @@"
              " $INSERT_AFTER_LINE"
              "+$MAKEFILE_INSERT_LINE"
            )
            
            # 生成完整的git格式补丁
            {
              # Git补丁头
              echo "From $(date +%s | sha1sum | cut -c1-40) Mon Sep 17 00:00:00 2001"
              echo "From: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
              echo "Date: $(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
              echo "Subject: [PATCH] Add $dts_name"
              echo ""
              echo "---"
              echo " arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/Makefile         | 1 +"
              echo " arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/$filename        | $line_count +"
              echo " 2 files changed, $(($line_count + 1)) insertions(+)"
              echo " create mode 100644 arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/$filename"
              echo ""
              echo "diff --git a/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/Makefile b/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/Makefile"
              echo "index abcdef0..1234567 100644"
              echo "--- a/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/Makefile"
              echo "+++ b/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/Makefile"
              echo "@@ -X,Y +X,Z @@"
              
              # 这里需要更智能地生成Makefile补丁内容
              # 简化处理：我们添加一行
              # 实际应该根据INSERT_AFTER_LINE找到正确位置
              echo " $INSERT_AFTER_LINE"
              echo "+$MAKEFILE_INSERT_LINE"
              echo ""
              echo "diff --git a/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/$filename b/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/$filename"
              echo "new file mode 100644"
              echo "index 0000000..$(date +%s | cut -c1-7)"
              echo "--- /dev/null"
              echo "+++ b/arch/arm64/boot/dts/$KERNEL_DTS_SUBDIR/$filename"
              echo "@@ -0,0 +1,$line_count @@"
              
              # 添加DTS内容，每行前加+
              sed 's/^/+/' "$dts_file"
            } > "$patch_path"
            
            echo "  ✅ 生成：$patch_name"
          done
          
          echo "📊 生成完成"

      - name: 4. 验证补丁格式
        run: |
          OPHUB_PATCH_DIR="${{ env.OPHUB_PATCH_DIR }}"
          
          echo "🔍 验证补丁格式..."
          
          if [ ! -d "$OPHUB_PATCH_DIR" ]; then
            echo "❌ 错误：补丁目录不存在"
            exit 1
          fi
          
          # 检查补丁文件
          find "$OPHUB_PATCH_DIR" -name "*.patch" | while read patch_file; do
            patch_name=$(basename "$patch_file")
            echo "检查：$patch_name"
            
            # 验证文件名格式
            if [[ "$patch_name" =~ ^301-dts-add-[a-zA-Z0-9]+-[a-zA-Z0-9_-]+-dtb\.patch$ ]]; then
              echo "  ✅ 文件名格式正确"
            else
              echo "  ⚠️  文件名格式可能不正确"
            fi
            
            # 验证是否包含git补丁头
            if head -n 1 "$patch_file" | grep -q "^From "; then
              echo "  ✅ 包含git补丁头"
            else
              echo "  ❌ 缺少git补丁头"
            fi
            
            # 验证是否包含Makefile修改
            if grep -q "Makefile" "$patch_file"; then
              echo "  ✅ 包含Makefile修改"
            else
              echo "  ❌ 缺少Makefile修改"
            fi
            
            # 验证是否包含DTS文件
            if grep -q "\.dts" "$patch_file"; then
              echo "  ✅ 包含DTS文件"
            else
              echo "  ❌ 缺少DTS文件"
            fi
            
            # 显示补丁头信息
            echo "  补丁头预览："
            head -n 15 "$patch_file" | sed 's/^/    /'
          done

      - name: 5. 自动提交补丁
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "${{ env.OPHUB_PATCH_DIR }}"/
          
          if git diff --cached --quiet; then
            echo "ℹ️ 无新补丁，无需提交"
          else
            echo "📋 将要提交的文件："
            git diff --cached --name-only
            
            COMMIT_MSG="DTS补丁+Makefile更新: ${{ env.DIR_NAME }} | 内核子目录: ${{ env.KERNEL_DTS_SUBDIR }}"
            git commit -m "$COMMIT_MSG"
            git push origin main
            echo "✅ 补丁已提交并推送"
          fi
