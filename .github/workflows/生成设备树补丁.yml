name: 生成设备树补丁
on:
  workflow_dispatch:
    inputs:
      dts_source_dir:
        description: '选择DTS源目录'
        required: true
        type: choice
        default: 'custom-dts/common-kernel-patches'
        options:
          - custom-dts/5.10.y
          - custom-dts/5.15.y
          - custom-dts/6.1.y
          - custom-dts/6.6.y
          - custom-dts/6.12.y
          - custom-dts/common-kernel-patches
      kernel_dts_subdir:
        description: '内核DTS子目录（如rockchip/sunxi）'
        required: true
        default: 'rockchip'
        type: string

permissions:
  contents: write

jobs:
  dts2patch:
    runs-on: ubuntu-latest
    shell: bash
    env:
      # 核心环境变量，固定内核DTS根路径（匹配unifreq）
      KERNEL_DTS_ROOT: 'arch/arm64/boot/dts'
      PATCH_BASE: 'kernel-patch/beta'

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: 2. 定义路径 & 校验DTS文件
        run: |
          # 提取源目录名，映射ophub输出目录
          SRC_NAME=$(basename ${{ github.event.inputs.dts_source_dir }})
          if [ "$SRC_NAME" = "common-kernel-patches" ]; then
            OUTPUT_DIR="${{ env.PATCH_BASE }}/common-kernel-patches"
          else
            OUTPUT_DIR="${{ env.PATCH_BASE }}/linux-$SRC_NAME"
          fi
          # 定义DTS源目录、内核子目录
          DTS_SRC=${{ github.event.inputs.dts_source_dir }}
          DTS_SUB=${{ github.event.inputs.kernel_dts_subdir }}
          
          # 写入环境变量
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
          echo "DTS_SRC=$DTS_SRC" >> $GITHUB_ENV
          echo "DTS_SUB=$DTS_SUB" >> $GITHUB_ENV

          # 严格校验：DTS目录存在+有实际.dts文件（排除空文件/通配符误判）
          if [ ! -d "$DTS_SRC" ]; then
            echo "❌ 错误：DTS源目录 $DTS_SRC 不存在"
            exit 1
          fi
          # 筛选真实的.dts文件（排除目录/链接）
          DTS_FILES=($(find "$DTS_SRC" -maxdepth 1 -type f -name "*.dts" -size +0c))
          if [ ${#DTS_FILES[@]} -eq 0 ]; then
            echo "❌ 错误：$DTS_SRC 下无有效.dts文件（非空/普通文件）"
            exit 1
          fi
          echo "✅ 检测到${#DTS_FILES[@]}个有效DTS：${DTS_FILES[@]##*/}"
          echo "DTS_FILES=${DTS_FILES[*]}" >> $GITHUB_ENV

      - name: 3. 生成标准内核路径补丁（核心步骤）
        run: |
          # 创建输出目录
          mkdir -p "$OUTPUT_DIR"
          # 构建模拟内核DTS路径
          ORI_DIR="./kernel_ori/$KERNEL_DTS_ROOT/$DTS_SUB"
          MOD_DIR="./kernel_mod/$KERNEL_DTS_ROOT/$DTS_SUB"
          mkdir -p "$ORI_DIR" "$MOD_DIR"

          # 遍历每个DTS，生成独立补丁（一个DTS对应一个补丁）
          for dts in $DTS_FILES; do
            dts_basename=$(basename "$dts")
            patch_file="$OUTPUT_DIR/${dts_basename%.dts}.dts.patch"
            # 复制DTS到模拟的内核修改目录（匹配真实内核路径）
            cp -f "$dts" "$MOD_DIR/"
            # 生成标准unified格式新增补丁（仅+号，匹配ophub编译规范）
            diff -Naur --no-dereference "$ORI_DIR/../" "$MOD_DIR/../" > "$patch_file"
            
            # 最终校验：补丁非空+含有效diff内容
            if [ ! -s "$patch_file" ] || ! grep -q "^+++ " "$patch_file"; then
              echo "❌ 错误：$dts_basename 生成补丁为空/无效"
              rm -f "$patch_file"
              exit 1
            fi
            # 强制UTF-8编码（避免编译乱码，仅做编码转换不修改内容）
            iconv -f utf-8 -t utf-8 -c "$patch_file" -o "$patch_file"
            echo "✅ 生成补丁：$patch_file（匹配路径：$KERNEL_DTS_ROOT/$DTS_SUB/$dts_basename）"
          done

          # 清理模拟目录
          rm -rf ./kernel_ori ./kernel_mod

      - name: 4. 提交并推送补丁
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 仅添加生成的补丁文件
          git add "$OUTPUT_DIR/*.dts.patch"
          # 提交（无新文件则跳过）
          git commit -m "DTS2Patch: 生成${#DTS_FILES[@]}个设备树补丁 | 目录：$OUTPUT_DIR" || {
            echo "ℹ 无新的补丁文件需要提交"
            exit 0
          }
          # 推送到主分支
          git push origin main
          echo "🎉 所有补丁已推送至仓库 $OUTPUT_DIR 目录"
