name: 自动转换设备树补丁
on:
  workflow_dispatch:  # 只保留手动触发

# 权限
permissions:
  contents: write

jobs:
  auto-convert-dts:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 2. 扫描custom-dts目录结构
        run: |
          set -euo pipefail
          echo "📁 开始扫描custom-dts目录..."
          
          # 创建扫描结果文件
          SCAN_FILE="${{ github.workspace }}/dts_scan.txt"
          echo "内核版本 | 子目录 | DTS文件数" > "$SCAN_FILE"
          echo "--------|--------|----------" >> "$SCAN_FILE"
          
          # 查找所有内核版本目录
          find "${{ github.workspace }}/custom-dts" -maxdepth 1 -type d -name "linux-*.y" | while read -r kernel_dir; do
            kernel_name=$(basename "$kernel_dir")
            echo "🔍 扫描内核: $kernel_name"
            
            # 遍历子目录
            find "$kernel_dir" -mindepth 1 -maxdepth 1 -type d | while read -r subdir; do
              subdir_name=$(basename "$subdir")
              dts_count=$(find "$subdir" -type f -name "*.dts" | wc -l)
              
              if [ "$dts_count" -gt 0 ]; then
                echo "$kernel_name | $subdir_name | $dts_count" >> "$SCAN_FILE"
                echo "  📂 子目录 $subdir_name: $dts_count 个DTS文件"
              fi
            done
          done
          
          # 显示扫描结果
          echo ""
          echo "📊 扫描完成:"
          cat "$SCAN_FILE"

      - name: 3. 为每个内核版本和子目录生成补丁
        run: |
          set -euo pipefail
          
          # 工具函数：提取CONFIG_ARCH变量
          extract_config_arch() {
            local makefile="$1"
            local subdir_name="$2"
            
            # 从Makefile中查找CONFIG_ARCH配置
            local config_line=$(grep -m1 "dtb-\$(CONFIG_ARCH_" "$makefile" 2>/dev/null || true)
            
            if [ -n "$config_line" ]; then
              # 提取CONFIG_ARCH_后面的部分
              local config_arch=$(echo "$config_line" | sed -n 's/.*CONFIG_ARCH_\([A-Za-z0-9_]*\)).*/\1/p')
              if [ -n "$config_arch" ]; then
                echo "$config_arch"
                return 0
              fi
            fi
            
            # 如果没找到，根据子目录名猜测
            case "$subdir_name" in
              rockchip) echo "ROCKCHIP" ;;
              amlogic) echo "AMLOGIC" ;;
              sunxi) echo "SUNXI" ;;
              *) echo "$(echo "$subdir_name" | tr '[:lower:]' '[:upper:]')" ;;
            esac
          }
          
          # 工具函数：查找Makefile中的插入位置
          find_makefile_insertion_point() {
            local makefile="$1"
            local dts_name="$2"
            local device_series="$3"
            
            echo "🔍 设备系列: $device_series"
            
            # 1. 首先尝试在相同设备系列的条目后面插入
            local line_num=$(grep -n "+=.*$device_series" "$makefile" | tail -1 | cut -d':' -f1)
            
            if [ -n "$line_num" ]; then
              echo "✅ 找到相同设备系列的插入位置: 第 $line_num 行"
              echo "$line_num"
              return 0
            fi
            
            # 2. 如果没有相同设备系列，查找所有dtb条目的最后一行
            line_num=$(grep -n "+=.*\.dtb" "$makefile" | tail -1 | cut -d':' -f1)
            
            if [ -n "$line_num" ]; then
              echo "✅ 在所有dtb条目后插入: 第 $line_num 行"
              echo "$line_num"
              return 0
            fi
            
            # 3. 如果还没有，在文件末尾插入
            local total_lines=$(wc -l < "$makefile")
            [ "$total_lines" -eq 0 ] && total_lines=1
            echo "⚠️  未找到合适位置，在文件末尾插入 (第 $total_lines 行)"
            echo "$total_lines"
          }
          
          # 工具函数：生成补丁文件
          generate_patch() {
            local kernel_dir="$1"
            local subdir="$2"
            local dts_file="$3"
            local patch_number="$4"
            
            local kernel_name=$(basename "$kernel_dir")
            local subdir_name=$(basename "$subdir")
            local dts_name=$(basename "$dts_file" .dts)
            local dts_base=$(basename "$dts_file")
            
            # 提取设备系列（第一个'-'之前的部分）
            local device_series=$(echo "$dts_name" | cut -d'-' -f1)
            [ -z "$device_series" ] && device_series="$dts_name"
            
            # 补丁输出目录
            local patch_output_dir="${{ github.workspace }}/kernel-patch/beta/$kernel_name"
            mkdir -p "$patch_output_dir"
            
            # 生成补丁文件名
            local patch_filename="${patch_number}-dts-add-${subdir_name}-${dts_name}-dtb.patch"
            local patch_path="$patch_output_dir/$patch_filename"
            
            # 获取Makefile路径
            local makefile_path="$subdir/Makefile"
            
            if [ ! -f "$makefile_path" ]; then
              echo "❌ 错误: $makefile_path 不存在"
              return 1
            fi
            
            # 提取CONFIG_ARCH变量
            local config_arch=$(extract_config_arch "$makefile_path" "$subdir_name")
            echo "📝 CONFIG_ARCH_$config_arch"
            
            # 计算Makefile插入位置
            local insert_line=$(find_makefile_insertion_point "$makefile_path" "$dts_name" "$device_series")
            
            # 创建临时目录用于生成diff
            local temp_dir=$(mktemp -d)
            local orig_dir="$temp_dir/orig"
            local new_dir="$temp_dir/new"
            
            mkdir -p "$orig_dir/arch/arm64/boot/dts/$subdir_name"
            mkdir -p "$new_dir/arch/arm64/boot/dts/$subdir_name"
            
            # 复制Makefile到原始目录
            cp "$makefile_path" "$orig_dir/arch/arm64/boot/dts/$subdir_name/Makefile"
            
            # 创建新的Makefile，在指定位置插入一行
            awk -v line="$insert_line" -v entry="dtb-\$(CONFIG_ARCH_${config_arch}) += ${dts_name}.dtb" '
            {
              if (NR == line) {
                print $0
                print entry
              } else {
                print $0
              }
            }' "$makefile_path" > "$new_dir/arch/arm64/boot/dts/$subdir_name/Makefile"
            
            # 复制DTS文件到新目录
            cp "$dts_file" "$new_dir/arch/arm64/boot/dts/$subdir_name/$dts_base"
            
            # 生成补丁
            cd "$temp_dir"
            diff -Naur orig new > "$patch_path" 2>/dev/null || true
            
            # 检查补丁是否生成成功
            if [ ! -s "$patch_path" ]; then
              echo "❌ 补丁生成失败"
              rm -rf "$temp_dir"
              return 1
            fi
            
            # 添加Git补丁头
            local commit_hash=$(git rev-parse --short HEAD 2>/dev/null || echo "0000000")
            local timestamp=$(date -u '+%a, %d %b %Y %H:%M:%S +0000')
            
            {
              echo "From ${commit_hash}0000000000000000000000000000000000000000 Mon Sep 17 00:00:00 2001"
              echo "From: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
              echo "Date: $timestamp"
              echo "Subject: [PATCH] Add $dts_name"
              echo ""
              echo "---"
              echo " arch/arm64/boot/dts/$subdir_name/Makefile         |   1 +"
              echo " arch/arm64/boot/dts/$subdir_name/$dts_base       |   $(wc -l < "$dts_file") +"
              echo " 2 files changed, $(($(wc -l < "$dts_file") + 1)) insertions(+)"
              echo " create mode 100644 arch/arm64/boot/dts/$subdir_name/$dts_base"
              echo ""
              cat "$patch_path"
            } > "${patch_path}.new"
            
            mv "${patch_path}.new" "$patch_path"
            
            # 清理临时目录
            cd - > /dev/null
            rm -rf "$temp_dir"
            
            echo "✅ 生成补丁: $patch_filename"
            return 0
          }
          
          # 主处理逻辑
          echo "🚀 开始生成设备树补丁..."
          
          # 统计变量
          TOTAL_PATCHES=0
          SUCCESS_COUNT=0
          ERROR_COUNT=0
          
          # 查找所有内核版本目录
          kernel_dirs=$(find "${{ github.workspace }}/custom-dts" -maxdepth 1 -type d -name "linux-*.y")
          
          if [ -z "$kernel_dirs" ]; then
            echo "⚠️  未找到任何内核版本目录"
            exit 0
          fi
          
          # 遍历所有内核版本目录
          for kernel_dir in $kernel_dirs; do
            kernel_name=$(basename "$kernel_dir")
            echo ""
            echo "📦 处理内核: $kernel_name"
            echo "========================================"
            
            # 查找所有子目录
            subdirs=$(find "$kernel_dir" -mindepth 1 -maxdepth 1 -type d)
            
            if [ -z "$subdirs" ]; then
              echo "  ℹ️  该内核版本下无子目录"
              continue
            fi
            
            for subdir in $subdirs; do
              subdir_name=$(basename "$subdir")
              
              # 检查是否有DTS文件
              dts_files=$(find "$subdir" -name "*.dts")
              
              if [ -z "$dts_files" ]; then
                echo "  ⏭️  跳过 $subdir_name: 无DTS文件"
                continue
              fi
              
              # 检查是否有Makefile
              if [ ! -f "$subdir/Makefile" ]; then
                echo "  ⏭️  跳过 $subdir_name: 无Makefile文件"
                continue
              fi
              
              dts_count=$(echo "$dts_files" | wc -l)
              echo "  📁 处理 $subdir_name: 找到 $dts_count 个DTS文件"
              
              # 对DTS文件排序
              sorted_dts_files=$(echo "$dts_files" | sort)
              
              # 为每个DTS文件生成补丁，编号从301开始
              local_patch_number=301
              for dts_file in $sorted_dts_files; do
                echo "    🔧 处理: $(basename "$dts_file")"
                
                if generate_patch "$kernel_dir" "$subdir" "$dts_file" "$local_patch_number"; then
                  SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                else
                  ERROR_COUNT=$((ERROR_COUNT + 1))
                fi
                
                local_patch_number=$((local_patch_number + 1))
                TOTAL_PATCHES=$((TOTAL_PATCHES + 1))
              done
            done
          done
          
          echo ""
          echo "========================================"
          echo "📊 生成统计:"
          echo "  总共处理: $TOTAL_PATCHES 个文件"
          echo "  成功: $SUCCESS_COUNT"
          echo "  失败: $ERROR_COUNT"
          
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "❌ 有 $ERROR_COUNT 个补丁生成失败"
            exit 1
          fi

      - name: 4. 验证生成的补丁
        run: |
          set -euo pipefail
          echo "🔍 验证生成的补丁..."
          
          PATCH_ROOT="${{ github.workspace }}/kernel-patch/beta"
          
          if [ ! -d "$PATCH_ROOT" ]; then
            echo "⚠️  补丁目录不存在"
            exit 0
          fi
          
          # 统计补丁文件
          PATCH_COUNT=$(find "$PATCH_ROOT" -name "*.patch" | wc -l)
          
          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "⚠️  未生成任何补丁文件"
            exit 0
          fi
          
          echo "✅ 找到 $PATCH_COUNT 个补丁文件"
          echo ""
          echo "📁 补丁目录结构:"
          
          # 显示目录结构
          kernel_dirs=$(find "$PATCH_ROOT" -type d -name "linux-*")
          for dir in $kernel_dirs; do
            echo "  $(basename "$dir")"
            patch_files=$(find "$dir" -name "*.patch" | sort)
            for patch_file in $patch_files; do
              echo "    📄 $(basename "$patch_file")"
            done
          done
          
          # 检查补丁格式
          echo ""
          echo "🔬 检查补丁格式:"
          ERROR_COUNT=0
          
          all_patches=$(find "$PATCH_ROOT" -name "*.patch")
          
          for patch_file in $all_patches; do
            patch_name=$(basename "$patch_file")
            
            # 检查关键元素
            if ! grep -q "^From " "$patch_file"; then
              echo "  ❌ $patch_name: 缺少From头"
              ERROR_COUNT=$((ERROR_COUNT + 1))
              continue
            fi
            
            if ! grep -q "^Subject: \[PATCH\]" "$patch_file"; then
              echo "  ❌ $patch_name: 缺少Subject"
              ERROR_COUNT=$((ERROR_COUNT + 1))
              continue
            fi
            
            if ! grep -q "Makefile" "$patch_file"; then
              echo "  ❌ $patch_name: 缺少Makefile修改"
              ERROR_COUNT=$((ERROR_COUNT + 1))
              continue
            fi
            
            if ! grep -q "\.dts" "$patch_file"; then
              echo "  ❌ $patch_name: 缺少DTS文件"
              ERROR_COUNT=$((ERROR_COUNT + 1))
              continue
            fi
            
            echo "  ✅ $patch_name: 格式正确"
          done
          
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "❌ 有 $ERROR_COUNT 个补丁格式错误"
            exit 1
          fi

      - name: 5. 提交生成的补丁
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "📋 检查文件变更..."
          
          # 检查是否有新文件
          if git status --porcelain kernel-patch/beta | grep -q "^??" || git status --porcelain kernel-patch/beta | grep -q "^A "; then
            echo "📦 检测到新补丁文件"
            
            # 显示将要添加的文件
            echo "将要添加的文件:"
            git status --porcelain kernel-patch/beta | sed 's/^/  /'
            
            # 添加补丁文件
            git add kernel-patch/beta/
            
            # 统计信息
            KERNEL_VERSIONS=$(find kernel-patch/beta -maxdepth 1 -type d -name "linux-*" | xargs -I {} basename {} | tr '\n' ', ' | sed 's/, $//')
            PATCH_COUNT=$(find kernel-patch/beta -name "*.patch" | wc -l)
            
            # 提交
            COMMIT_MSG="自动生成设备树补丁 ($PATCH_COUNT 个补丁)
            
涉及内核版本: ${KERNEL_VERSIONS}
生成时间: $(date +'%Y-%m-%d %H:%M:%S')

自动扫描custom-dts目录并生成符合Ophub格式的补丁文件。"

            echo "提交信息:"
            echo "$COMMIT_MSG"
            
            git commit -m "$COMMIT_MSG"
            
            # 推送到仓库
            git push origin main
            echo "✅ 补丁已提交并推送到仓库"
          else
            echo "ℹ️  无新补丁文件，无需提交"
          fi
