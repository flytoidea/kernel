name: 编译瑞芯微 U-Boot (最终修正版)

on:
  workflow_dispatch:
    inputs:
      u_boot_repo:
        description: 'U-Boot 仓库地址'
        required: false
        default: 'https://github.com/u-boot/u-boot.git'
      u_boot_ref:
        description: 'U-Boot 分支或标签（建议 v2025.01 以上）'
        required: false
        default: 'v2025.01'
      defconfig:
        description: 'defconfig 名称'
        required: false
        default: 'rk3568_hinlink_h68ktv_defconfig'
      use_custom_dtb:
        description: '使用自定义DTB'
        required: true
        type: choice
        options:
          - '否'
          - '是'
        default: '是'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          path: user-repo

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y git make gcc g++ libssl-dev device-tree-compiler \
            python3 python3-dev python3-pip gcc-aarch64-linux-gnu bison flex bc cpio

      - name: 克隆 U-Boot
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.u_boot_ref }} \
            ${{ github.event.inputs.u_boot_repo }} u-boot

      - name: 克隆 rkbin
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: 部署自定义 DTB 和配置
        run: |
          set -e
          if [ "${{ github.event.inputs.use_custom_dtb }}" == "是" ]; then
            echo "=== 部署自定义文件 ==="
            # 复制 defconfig（直接指定文件名，避免通配符问题）
            CUSTOM_DEFCONFIG="user-repo/diy-rockchip_uboot/configs/${{ github.event.inputs.defconfig }}"
            if [ -f "$CUSTOM_DEFCONFIG" ]; then
              cp -v "$CUSTOM_DEFCONFIG" u-boot/configs/
            else
              echo "错误：找不到 defconfig 文件: $CUSTOM_DEFCONFIG"
              exit 1
            fi
            # 复制 dtb（如果目录中有 .dtb 文件）
            if ls user-repo/diy-rockchip_uboot/dtb/*.dtb 1>/dev/null 2>&1; then
              cp -v user-repo/diy-rockchip_uboot/dtb/*.dtb u-boot/arch/arm/dts/
            else
              echo "警告：未找到 .dtb 文件，将使用 U-Boot 自带的 dtb"
            fi
          fi

      - name: 检查配置和 DTB
        run: |
          echo "=== configs 目录内容 ==="
          ls -la u-boot/configs/ | grep -E "defconfig|rk3568" || echo "无 defconfig"
          echo "=== arch/arm/dts 中的自定义 dtb ==="
          ls -la u-boot/arch/arm/dts/ | grep -E "rk3568-hinlink" || echo "无自定义 dtb"
          echo "=== defconfig 内容预览 ==="
          head -20 u-boot/configs/${{ github.event.inputs.defconfig }} || echo "无法读取 defconfig"

      - name: 编译 U-Boot
        run: |
          cd u-boot
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ROCKCHIP_TPL=$(ls ../rkbin/bin/rk35/rk3568_ddr_*.bin | head -1)
          export BL31=$(ls ../rkbin/bin/rk35/rk3568_bl31_v*.elf | head -1)

          # 确认 defconfig 存在
          if [ ! -f "configs/${{ github.event.inputs.defconfig }}" ]; then
            echo "ERROR: configs/${{ github.event.inputs.defconfig }} 不存在！"
            exit 1
          fi

          # 生成配置
          echo "执行: make ${{ github.event.inputs.defconfig }}"
          make ${{ github.event.inputs.defconfig }}

          # 检查 .config 是否生成
          if [ ! -f .config ]; then
            echo "ERROR: make defconfig 未生成 .config"
            exit 1
          fi

          # 避免交互
          make olddefconfig

          # 强制验证 ARM64 是否启用
          if ! grep -q "CONFIG_ARM64=y" .config; then
            echo "ERROR: ARM64 未启用，配置失败"
            echo "当前 .config 中 ARCH 相关行："
            grep -E "CONFIG_ARM|CONFIG_ARCH|CONFIG_SANDBOX" .config || true
            exit 1
          fi

          # 编译
          make -j$(nproc)

      - name: 打包固件
        run: |
          mkdir -p output
          cd u-boot
          for f in idbloader.img u-boot.itb uboot.img trust.img u-boot-rockchip.bin; do
            if [ -f "$f" ]; then
              cp -v "$f" ../output/
            else
              echo "警告：$f 不存在，跳过"
            fi
          done
          cd ..
          zip -j u-boot-h68ktv.zip output/* || echo "没有可打包的文件"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-h68ktv
          path: output/
          retention-days: 30

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.sha }}
          name: U-Boot H68KTV 自动构建 ${{ github.sha }}
          body: |
            瑞芯微 RK3568 Hinlink H68KTV U-Boot 自动编译
            U-Boot: ${{ github.event.inputs.u_boot_ref }}
            Defconfig: ${{ github.event.inputs.defconfig }}
            自定义DTB: ${{ github.event.inputs.use_custom_dtb }}
          files: u-boot-h68ktv.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
