name: 编译瑞芯微 U-Boot

on:
  workflow_dispatch:
    inputs:
      u_boot_repo:
        description: 'U-Boot 仓库地址'
        required: false
        default: 'https://github.com/u-boot/u-boot.git'
      u_boot_ref:
        description: 'U-Boot 分支或标签（如 v2025.01）'
        required: false
        default: 'v2025.01'
      defconfig:
        description: 'defconfig 名称'
        required: false
        default: 'rk3568_hinlink_h68ktv_defconfig'
      use_custom_dtb:
        description: '使用自定义DTB'
        required: true
        type: choice
        options:
          - '否'
          - '是'
        default: '是'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          path: user-repo

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y git make gcc g++ libssl-dev device-tree-compiler \
            python3 python3-dev python3-pip gcc-aarch64-linux-gnu bison flex bc cpio

      - name: 克隆 U-Boot
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.u_boot_ref }} \
            ${{ github.event.inputs.u_boot_repo }} u-boot

      - name: 克隆 rkbin
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: 部署自定义 DTB 和 defconfig
        run: |
          if [ "${{ github.event.inputs.use_custom_dtb }}" == "是" ]; then
            echo "使用自定义 DTB + defconfig"
            # 复制设备树（如果有）
            if [ -d "user-repo/diy-Rockchip_uboot/dtb" ]; then
              cp -v user-repo/diy-Rockchip_uboot/dtb/*.dtb u-boot/arch/arm/dts/ || true
            fi
            # 复制 defconfig
            if [ -d "user-repo/diy-Rockchip_uboot/configs" ]; then
              cp -v user-repo/diy-Rockchip_uboot/configs/*_defconfig u-boot/configs/ || true
            fi
          fi

      - name: 配置 U-Boot（不使用 menuconfig）
        run: |
          cd u-boot
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 加载基础 defconfig
          make ${{ github.event.inputs.defconfig }}
          
          # 可选：通过 sed 直接修改 .config 中的任何额外选项（示例）
          # echo 'CONFIG_SYS_LOAD_ADDR=0x2000000' >> .config
          # 或者修改已有配置：
          # sed -i 's/CONFIG_SYS_LOAD_ADDR=.*/CONFIG_SYS_LOAD_ADDR=0x2000000/' .config
          
          # 生成完整配置（自动处理新配置项，不会打开交互界面）
          make olddefconfig

      - name: 编译 U-Boot
        run: |
          cd u-boot
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ROCKCHIP_TPL=$(ls ../rkbin/bin/rk35/rk3568_ddr_*.bin | head -1)
          export BL31=$(ls ../rkbin/bin/rk35/rk3568_bl31_v*.elf | head -1)
          
          make -j$(nproc)

      - name: 打包固件
        run: |
          mkdir -p output
          cp -v u-boot/idbloader.img output/
          cp -v u-boot/u-boot.itb output/
          cp -v u-boot/uboot.img output/
          cp -v u-boot/trust.img output/
          cp -v u-boot/u-boot-rockchip.bin output/
          zip -j u-boot-h68ktv.zip output/*

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-h68ktv
          path: output/
          retention-days: 30

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.sha }}
          name: U-Boot H68KTV 自动构建 ${{ github.sha }}
          body: |
            瑞芯微 RK3568 Hinlink H68KTV U-Boot 自动编译
            U-Boot: ${{ github.event.inputs.u_boot_ref }}
            Defconfig: ${{ github.event.inputs.defconfig }}
            自定义DTB: ${{ github.event.inputs.use_custom_dtb }}
          files: u-boot-h68ktv.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
