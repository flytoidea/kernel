name: 编译瑞芯微 U-Boot (最终稳定版)

on:
  workflow_dispatch:
    inputs:
      u_boot_repo:
        description: 'U-Boot 仓库地址'
        required: false
        default: 'https://github.com/rockchip-linux/u-boot.git'
      u_boot_ref:
        description: 'U-Boot 分支或标签'
        required: false
        default: 'next-dev'
      defconfig:
        description: 'defconfig 名称 (例如 rk3568_hinlink_h68ktv 或 rk3568_hinlink_h68ktv_defconfig)'
        required: false
        default: 'rk3568_hinlink_h68ktv_defconfig'
      use_custom_dtb:
        description: '使用自定义DTB'
        required: true
        type: choice
        options:
          - '否'
          - '是'
        default: '是'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y git make gcc g++ libssl-dev device-tree-compiler \
            python3 python3-dev python3-pip gcc-aarch64-linux-gnu bison flex bc cpio

      - name: 克隆 U-Boot
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.u_boot_ref }} \
            ${{ github.event.inputs.u_boot_repo }} u-boot

      - name: 克隆 rkbin
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: 部署自定义 DTB 和 defconfig
        run: |
          set -e
          if [ "${{ github.event.inputs.use_custom_dtb }}" == "是" ]; then
            if [ -d "diy-rockchip_uboot/configs" ]; then
              cp -v diy-rockchip_uboot/configs/${{ github.event.inputs.defconfig }} u-boot/configs/
            elif [ -d "diy-Rockchip_uboot/configs" ]; then
              cp -v diy-Rockchip_uboot/configs/${{ github.event.inputs.defconfig }} u-boot/configs/
            else
              echo "警告: 未找到自定义 configs 目录，将使用默认 defconfig"
            fi
            if [ -d "diy-rockchip_uboot/dtb" ]; then
              cp -v diy-rockchip_uboot/dtb/*.dtb u-boot/arch/arm/dts/ 2>/dev/null || true
            fi
          fi
          # 移动 rkbin 到 u-boot 目录下
          mv rkbin u-boot/

      - name: 使用 make.sh 编译 U-Boot
        run: |
          cd u-boot
          # 清理
          make mrproper
          # 获取 defconfig 名称，去掉 _defconfig 后缀（make.sh 会自动添加）
          DEFCONFIG_NAME="${{ github.event.inputs.defconfig }}"
          DEFCONFIG_NAME="${DEFCONFIG_NAME%_defconfig}"
          echo "使用板子名称: $DEFCONFIG_NAME"
          # 确保 make.sh 可执行
          chmod +x make.sh
          # 编译
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ./make.sh "$DEFCONFIG_NAME"

      - name: 打包固件
        run: |
          mkdir -p output
          cd u-boot
          # 根据 make.sh 的实际输出，复制生成的固件文件到 output 目录
          for f in idbloader.img u-boot.itb uboot.img trust.img u-boot-rockchip.bin; do
            [ -f "$f" ] && cp -v "$f" ../output/
          done
          cd ..
          zip -j u-boot-h68ktv.zip output/*

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-h68ktv
          path: output/
          retention-days: 30

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.sha }}
          name: U-Boot H68KTV 自动构建
          body: "U-Boot: ${{ github.event.inputs.u_boot_ref }}"
          files: u-boot-h68ktv.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
