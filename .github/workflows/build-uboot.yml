name: 编译瑞芯微 U-Boot (终极版)

on:
  workflow_dispatch:
    inputs:
      u_boot_repo:
        description: 'U-Boot 仓库地址'
        required: false
        default: 'https://github.com/u-boot/u-boot.git'
      u_boot_ref:
        description: 'U-Boot 分支或标签'
        required: false
        default: 'v2025.01'
      defconfig:
        description: 'defconfig 名称'
        required: false
        default: 'rk3568_hinlink_h68ktv_defconfig'
      use_custom_dtb:
        description: '使用自定义DTB'
        required: true
        type: choice
        options:
          - '否'
          - '是'
        default: '是'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y git make gcc g++ libssl-dev device-tree-compiler \
            python3 python3-dev python3-pip gcc-aarch64-linux-gnu bison flex bc cpio

      - name: 克隆 U-Boot
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.u_boot_ref }} \
            ${{ github.event.inputs.u_boot_repo }} u-boot

      - name: 克隆 rkbin
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: 准备自定义 defconfig 和 DTB
        run: |
          cd u-boot
          # 直接写入完整的 defconfig 内容（已修正，包含 CONFIG_ARM64=y，无空行）
          cat > configs/${{ github.event.inputs.defconfig }} << 'EOF'
CONFIG_ARM64=y
CONFIG_ARCH_ROCKCHIP=y
CONFIG_ROCKCHIP_RK3568=y
CONFIG_SYS_SOC="rk3568"
CONFIG_OF_LIBFDT=y
CONFIG_OF_BOARD_SETUP=y
CONFIG_CMD_FDT=y
CONFIG_CMD_EXTENSION=y
CONFIG_SUPPORT_EXTENSION_SCAN=y
CONFIG_SPL_LIBCOMMON_SUPPORT=y
CONFIG_SPL_LIBGENERIC_SUPPORT=y
CONFIG_SPL_FRAMEWORK=y
CONFIG_SPL_MMC=y
CONFIG_SPL_SERIAL=y
CONFIG_SPL_STACK=0x400000
CONFIG_SPL_STACK_R=y
CONFIG_SPL_STACK_R_MALLOC_SIMPLE_LEN=0x100000
CONFIG_SPL_SYS_MALLOC_SIMPLE=y
CONFIG_SPL_ATF=y
CONFIG_SPL_ATF_NO_PLATFORM_PARAM=y
CONFIG_SPL_BOARD_INIT=y
CONFIG_SPL_BSS_START_ADDR=0x4000000
CONFIG_SPL_BSS_MAX_SIZE=0x20000
CONFIG_SYS_MMCSD_RAW_MODE_U_BOOT_SECTOR=0x200
CONFIG_SYS_MMCSD_FS_BOOT_PARTITION=1
CONFIG_SYS_TEXT_BASE=0x00200000
CONFIG_SYS_LOAD_ADDR=0x00080000
CONFIG_SYS_INIT_SP_ADDR=0x400000
CONFIG_NR_DRAM_BANKS=2
CONFIG_DEFAULT_DEVICE_TREE="rk3568-hinlink-h68ktv"
CONFIG_DEBUG_UART=y
CONFIG_DEBUG_UART_BASE=0xfef50000
CONFIG_DEBUG_UART_CLOCK=24000000
CONFIG_DEBUG_UART_SHIFT=2
CONFIG_ENV_SIZE=0x8000
CONFIG_ENV_OFFSET=0x3f8000
CONFIG_ENV_SECT_SIZE=0x10000
CONFIG_CMD_MMC=y
CONFIG_MMC=y
CONFIG_ROCKCHIP_DWMMC=y
CONFIG_ROCKCHIP_SDHCI=y
CONFIG_CMD_USB=y
CONFIG_USB=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_DWC2=y
CONFIG_USB_STORAGE=y
CONFIG_CMD_NET=y
CONFIG_NET=y
CONFIG_ETH_DESIGNWARE=y
CONFIG_ROCKCHIP_GMAC=y
CONFIG_PHY_GIGE=y
CONFIG_PCI=y
CONFIG_DM_PCI=y
CONFIG_PCIE_DW_ROCKCHIP=y
CONFIG_PHY_ROCKCHIP_SNPS_PCIE3=y
CONFIG_CMD_PCI=y
CONFIG_SYSRESET=y
CONFIG_BOOTDELAY=3
CONFIG_BOOTCOMMAND="pci enum; run boot_usb; run boot_mmc1; run boot_mmc0"
EOF

          # 如果用户提供了自定义 DTB，则复制
          if [ "${{ github.event.inputs.use_custom_dtb }}" == "是" ]; then
            if [ -d "../diy-rockchip_uboot/dtb" ]; then
              cp -v ../diy-rockchip_uboot/dtb/*.dtb arch/arm/dts/ 2>/dev/null || true
            elif [ -d "../diy-Rockchip_uboot/dtb" ]; then
              cp -v ../diy-Rockchip_uboot/dtb/*.dtb arch/arm/dts/ 2>/dev/null || true
            fi
          fi

      - name: 编译 U-Boot
        run: |
          cd u-boot
          # 生成 .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ github.event.inputs.defconfig }}
          # 验证 ARM64 已启用（小写 y）
          grep -q "^CONFIG_ARM64=y" .config || { echo "错误: ARM64 未启用"; exit 1; }
          # 设置环境变量并直接编译（不运行 olddefconfig/syncconfig）
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ROCKCHIP_TPL=$(ls ../rkbin/bin/rk35/rk3568_ddr_*.bin | head -1)
          export BL31=$(ls ../rkbin/bin/rk35/rk3568_bl31_v*.elf | head -1)
          make -j$(nproc)

      - name: 打包固件
        run: |
          mkdir -p output
          cd u-boot
          for f in idbloader.img u-boot.itb uboot.img trust.img u-boot-rockchip.bin; do
            [ -f "$f" ] && cp -v "$f" ../output/
          done
          cd ..
          zip -j u-boot-h68ktv.zip output/*

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-h68ktv
          path: output/
          retention-days: 30

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.sha }}
          name: U-Boot H68KTV 自动构建
          body: "U-Boot: ${{ github.event.inputs.u_boot_ref }}"
          files: u-boot-h68ktv.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
