name: 编译瑞芯微 U-Boot

on:
  workflow_dispatch:
    inputs:
      u_boot_repo:
        description: 'U-Boot 仓库地址'
        required: false
        default: 'https://github.com/u-boot/u-boot.git'
      u_boot_ref:
        description: 'U-Boot 分支或标签'
        required: false
        default: 'v2025.01'
      defconfig:
        description: 'defconfig 名称'
        required: false
        default: 'rk3568_hinlink_h68ktv_defconfig'
      use_custom_dtb:
        description: '使用自定义DTB与配置'
        required: true
        type: choice
        options:
          - '否'
          - '是'
        default: '是'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取当前仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y git make gcc g++ libssl-dev device-tree-compiler \
            python3 python3-dev python3-pip gcc-aarch64-linux-gnu bison flex bc cpio zip

      - name: 克隆 U-Boot
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.u_boot_ref }} \
            ${{ github.event.inputs.u_boot_repo }} u-boot

      - name: 克隆 rkbin 固件依赖
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: 部署自定义 defconfig & DTB
        run: |
          set -e
          if [ "${{ github.event.inputs.use_custom_dtb }}" = "是" ]; then
            echo "=== 开始部署自定义文件 ==="

            # 复制 defconfig
            if [ -f "diy-rockchip_uboot/configs/${{ github.event.inputs.defconfig }}" ]; then
              cp -v "diy-rockchip_uboot/configs/${{ github.event.inputs.defconfig }}" u-boot/configs/
            elif [ -f "diy-Rockchip_uboot/configs/${{ github.event.inputs.defconfig }}" ]; then
              cp -v "diy-Rockchip_uboot/configs/${{ github.event.inputs.defconfig }}" u-boot/configs/
            else
              echo "ERROR: 未找到自定义 defconfig"
              exit 1
            fi

            # 复制所有 dtb
            if [ -d "diy-rockchip_uboot/dtb" ] && ls diy-rockchip_uboot/dtb/*.dtb >/dev/null 2>&1; then
              cp -v diy-rockchip_uboot/dtb/*.dtb u-boot/arch/arm/dts/
            elif [ -d "diy-Rockchip_uboot/dtb" ] && ls diy-Rockchip_uboot/dtb/*.dtb >/dev/null 2>&1; then
              cp -v diy-Rockchip_uboot/dtb/*.dtb u-boot/arch/arm/dts/
            else
              echo "警告：未找到自定义 DTB 文件"
            fi
          fi

      - name: 编译 U-Boot
        run: |
          cd u-boot
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ROCKCHIP_TPL=$(realpath ../rkbin/bin/rk35/rk3568_ddr_*.bin | head -1)
          export BL31=$(realpath ../rkbin/bin/rk35/rk3568_bl31_v*.elf | head -1)

          make ${{ github.event.inputs.defconfig }}
          make olddefconfig

          grep -q "CONFIG_ARM64=y" .config || { echo "ARM64 未启用"; exit 1; }

          make -j$(nproc)

      - name: 整理固件
        run: |
          mkdir -p output
          cd u-boot
          for f in idbloader.img u-boot.itb uboot.img trust.img u-boot-rockchip.bin; do
            [ -f "$f" ] && cp -v "$f" ../output/
          done

      - name: 打包 ZIP
        run: |
          zip -j u-boot-h68ktv-${{ github.sha }}.zip output/*

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-h68ktv
          path: output/
          retention-days: 30

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.sha }}
          name: U-Boot H68KTV 自动构建 ${{ github.sha }}
          body: |
            U-Boot 版本：${{ github.event.inputs.u_boot_ref }}
            defconfig：${{ github.event.inputs.defconfig }}
          files: u-boot-h68ktv-${{ github.sha }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
