name: 编译瑞芯微U-Boot

on:
  workflow_dispatch:
    inputs:
      u_boot_repo:
        description: 'U-Boot 仓库地址'
        required: false
        default: 'https://github.com/u-boot/u-boot.git'
      u_boot_ref:
        description: 'U-Boot 分支或标签'
        required: false
        default: 'v2025.01'
      defconfig_url:
        description: 'defconfig 文件的原始 URL'
        required: false
        default: 'https://raw.githubusercontent.com/flytoidea/kernel/main/diy-rockchip_uboot/configs/rk3568_hinlink_h68ktv_defconfig'
      dtb_url:
        description: '自定义 DTB 文件的原始 URL（可选）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y git make gcc g++ libssl-dev device-tree-compiler \
            python3 python3-dev python3-pip gcc-aarch64-linux-gnu bison flex bc cpio wget

      - name: 克隆 U-Boot
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.u_boot_ref }} \
            ${{ github.event.inputs.u_boot_repo }} u-boot

      - name: 克隆 rkbin
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: 下载自定义 defconfig
        run: |
          wget -O u-boot/configs/rk3568_hinlink_h68ktv_defconfig ${{ github.event.inputs.defconfig_url }}
          if [ ! -s u-boot/configs/rk3568_hinlink_h68ktv_defconfig ]; then
            echo "错误：defconfig 下载失败"
            exit 1
          fi
          echo "=== defconfig 内容前5行 ==="
          head -5 u-boot/configs/rk3568_hinlink_h68ktv_defconfig
          # 验证第一行必须是 CONFIG_ARM64=y
          if ! grep -q "^CONFIG_ARM64=y" u-boot/configs/rk3568_hinlink_h68ktv_defconfig; then
            echo "错误：defconfig 第一行不是 CONFIG_ARM64=y"
            exit 1
          fi

      - name: 下载自定义 DTB（可选）
        run: |
          if [ -n "${{ github.event.inputs.dtb_url }}" ]; then
            wget -O u-boot/arch/arm/dts/rk3568-hinlink-h68ktv.dtb ${{ github.event.inputs.dtb_url }}
            echo "DTB 下载成功"
          else
            echo "未提供 DTB URL，将使用 U-Boot 自带的设备树"
          fi

      - name: 编译 U-Boot
        run: |
          cd u-boot
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ROCKCHIP_TPL=$(ls ../rkbin/bin/rk35/rk3568_ddr_*.bin | head -1)
          export BL31=$(ls ../rkbin/bin/rk35/rk3568_bl31_v*.elf | head -1)

          make rk3568_hinlink_h68ktv_defconfig
          make olddefconfig

          # 最终验证
          if ! grep -q "CONFIG_ARM64=y" .config; then
            echo "ERROR: ARM64 未启用，配置失败"
            echo "=== .config 中的关键符号 ==="
            grep -E "CONFIG_ARM64|CONFIG_SANDBOX|CONFIG_TARGET" .config || true
            exit 1
          fi

          make -j$(nproc)

      - name: 打包固件
        run: |
          mkdir -p output
          cd u-boot
          for f in idbloader.img u-boot.itb uboot.img trust.img u-boot-rockchip.bin; do
            [ -f "$f" ] && cp -v "$f" ../output/
          done
          cd ..
          zip -j u-boot-h68ktv.zip output/*

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-h68ktv
          path: output/
          retention-days: 30

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.sha }}
          name: U-Boot H68KTV 自动构建 ${{ github.sha }}
          body: |
            瑞芯微 RK3568 Hinlink H68KTV U-Boot 自动编译
            U-Boot: ${{ github.event.inputs.u_boot_ref }}
            Defconfig URL: ${{ github.event.inputs.defconfig_url }}
            DTB URL: ${{ github.event.inputs.dtb_url }}
          files: u-boot-h68ktv.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
