name: 构建 RK U-Boot

on:
  workflow_dispatch:        # 仅允许手动触发
    inputs:
      u_boot_repo:
        description: 'U-Boot 仓库地址 (默认主线)'
        required: false
        default: 'https://github.com/u-boot/u-boot.git'
      u_boot_ref:
        description: 'U-Boot 分支或标签 (如 v2025.01)'
        required: false
        default: 'v2025.01'
      defconfig:
        description: '使用的 defconfig (例如 rk3568_defconfig)'
        required: false
        default: 'rk3568_defconfig'
      custom_dts:
        description: '是否使用自定义设备树？(true/false)'
        required: false
        default: 'false'

# 移除了 push 触发，彻底禁用自动构建

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout user repo (自定义配置)
        uses: actions/checkout@v4
        with:
          path: user-repo

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make gcc g++ libssl-dev device-tree-compiler \
            python3 python3-dev python3-pip gcc-aarch64-linux-gnu bison flex bc cpio

      - name: Clone U-Boot source
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.u_boot_ref || 'v2025.01' }} \
            ${{ github.event.inputs.u_boot_repo || 'https://github.com/u-boot/u-boot.git' }} u-boot

      - name: Clone rkbin
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: Apply custom device tree or defconfig
        run: |
          if [ -d user-repo/configs ] && [ "${{ github.event.inputs.custom_dts }}" == "true" ]; then
            echo "应用自定义配置..."
            cp -rvf user-repo/dts/*.dts* u-boot/arch/arm/dts/ 2>/dev/null || true
            cp -rvf user-repo/configs/*_defconfig u-boot/configs/ 2>/dev/null || true
          else
            echo "使用默认配置"
          fi

      - name: Build U-Boot
        run: |
          cd u-boot
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          
          # 自动查找最新的 DDR 固件
          export ROCKCHIP_TPL=$(ls ../rkbin/bin/rk35/rk3568_ddr_*.bin | head -1)
          export BL31=$(ls ../rkbin/bin/rk35/rk3568_bl31_v*.elf | head -1)
          
          echo "Using ROCKCHIP_TPL=$ROCKCHIP_TPL"
          echo "Using BL31=$BL31"
          
          make ${{ github.event.inputs.defconfig || 'rk3568_defconfig' }}
          make -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-rockchip-bin-${{ github.sha }}
          path: |
            u-boot/idbloader.img
            u-boot/u-boot.itb
            u-boot/uboot.img
            u-boot/trust.img
            u-boot/u-boot-rockchip.bin
          retention-days: 30
