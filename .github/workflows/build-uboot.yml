name: 编译瑞芯微 U-Boot (本地路径最终版)

on:
  workflow_dispatch:
    inputs:
      u_boot_repo:
        description: 'U-Boot 仓库地址'
        required: false
        default: 'https://github.com/u-boot/u-boot.git'
      u_boot_ref:
        description: 'U-Boot 分支或标签'
        required: false
        default: 'v2025.01'
      defconfig:
        description: 'defconfig 名称'
        required: false
        default: 'rk3568_hinlink_h68ktv_defconfig'
      use_custom_dtb:
        description: '使用自定义DTB'
        required: true
        type: choice
        options:
          - '否'
          - '是'
        default: '是'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y git make gcc g++ libssl-dev device-tree-compiler \
            python3 python3-dev python3-pip gcc-aarch64-linux-gnu bison flex bc cpio

      - name: 克隆 U-Boot
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.u_boot_ref }} \
            ${{ github.event.inputs.u_boot_repo }} u-boot

      - name: 克隆 rkbin
        run: |
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

      - name: 部署自定义 DTB 和配置（并修复 defconfig）
        run: |
          set -e
          if [ "${{ github.event.inputs.use_custom_dtb }}" == "是" ]; then
            # 复制自定义 defconfig
            if [ -d "diy-rockchip_uboot/configs" ]; then
              cp -v diy-rockchip_uboot/configs/${{ github.event.inputs.defconfig }} u-boot/configs/
            elif [ -d "diy-Rockchip_uboot/configs" ]; then
              cp -v diy-Rockchip_uboot/configs/${{ github.event.inputs.defconfig }} u-boot/configs/
            else
              echo "警告: 未找到自定义 configs 目录，将使用默认 defconfig"
            fi
            # 复制自定义 DTB
            if [ -d "diy-rockchip_uboot/dtb" ]; then
              cp -v diy-rockchip_uboot/dtb/*.dtb u-boot/arch/arm/dts/ 2>/dev/null || true
            fi
          fi

          # 关键修复：确保 defconfig 中包含 CONFIG_ARM64=y
          cd u-boot
          DEFCONFIG_PATH="configs/${{ github.event.inputs.defconfig }}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            if ! grep -q "^CONFIG_ARM64=y" "$DEFCONFIG_PATH"; then
              echo "CONFIG_ARM64=y" >> "$DEFCONFIG_PATH"
              echo "已向 defconfig 添加 CONFIG_ARM64=y"
            fi
            # 同时删除可能存在的空行或错误行
            sed -i '/^TEXT_BASE=/d' "$DEFCONFIG_PATH"
            sed -i '/^SYS_UBOOT_START=/d' "$DEFCONFIG_PATH"
          else
            echo "错误: defconfig 文件不存在: $DEFCONFIG_PATH"
            exit 1
          fi

      - name: 编译 U-Boot（直接编译，不额外同步配置）
        run: |
          cd u-boot
          # 清理旧配置
          rm -f .config

          # 生成 .config（此时已包含 CONFIG_ARM64=y）
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ github.event.inputs.defconfig }}

          # 验证 ARM64 已启用
          if ! grep -q "^CONFIG_ARM64=y" .config; then
            echo "错误: .config 中未启用 ARM64，请检查 defconfig"
            exit 1
          fi

          # 设置环境变量
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ROCKCHIP_TPL=$(ls ../rkbin/bin/rk35/rk3568_ddr_*.bin | head -1)
          export BL31=$(ls ../rkbin/bin/rk35/rk3568_bl31_v*.elf | head -1)

          # 直接编译（make 会自动调用需要的配置同步，但不会重置 ARM64）
          make -j$(nproc)

      - name: 打包固件
        run: |
          mkdir -p output
          cd u-boot
          for f in idbloader.img u-boot.itb uboot.img trust.img u-boot-rockchip.bin; do
            [ -f "$f" ] && cp -v "$f" ../output/
          done
          cd ..
          zip -j u-boot-h68ktv.zip output/*

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-h68ktv
          path: output/
          retention-days: 30

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.sha }}
          name: U-Boot H68KTV 自动构建
          body: "U-Boot: ${{ github.event.inputs.u_boot_ref }}"
          files: u-boot-h68ktv.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
